liberty:{use:["Voor karren, rolcontainers en palletwagens met gemeten krachten: het percentage vrouwen en mannen voor wie de start- en volhoudkracht aanvaardbaar is (Liberty Mutual 2021, opvolger Snook; referentie voor ISO 11228-2). Gebruik KIM-PP als je geen dynamometer hebt.","For carts, roll containers and pallet trucks with measured forces: the share of women and men for whom the initial and sustained force is acceptable (Liberty Mutual 2021, successor of Snook; reference for ISO 11228-2). Use KIM-PP if you have no dynamometer."],
  prep:[["Meet met een dynamometer horizontaal op handhoogte: de startkracht (kar in beweging brengen) en de volhoudkracht (op snelheid houden), elk drie keer, en neem het gemiddelde. Meet de handhoogte en de afstand per rit; tel de ritten per uur.","Measure with a dynamometer horizontally at hand height: the initial force (setting the cart in motion) and the sustained force (keeping it at speed), three times each, and take the average. Measure hand height and distance per move; count the moves per hour."]],
  steps:[[["Kracht in kg (1 kg ≈ 9,8 N). Afstand in meters per rit; frequentie per minuut of per uur (4 ritten per uur = 0,067 per minuut).","Force in kg (1 kg ≈ 9.8 N). Distance in metres per move; frequency per minute or per hour (4 moves per hour = 0.067 per minute)."]]],
  read:[["Beide krachten worden getoetst; de laagste van de twee percentages bepaalt het oordeel. Groen ≥ 75 % van de gekozen groep, oranje 50–75 %, rood < 50 %. De 75 %-grens in de regels is de kracht die je in het ontwerp mag vragen.","Both forces are tested; the lower of the two percentages sets the verdict. Green ≥ 75 % of the chosen group, amber 50–75 %, red < 50 %. The 75 % limit in the rows is the force you may require in the design."],["Lange afstanden drukken vooral de volhoudkracht; vaak rijden drukt de startkracht.","Long distances mainly reduce the sustained force; frequent moves reduce the initial force."]],
  err:[["Alleen de startkracht meten; de volhoudkracht is bij lange afstanden bepalend.","Measuring only the initial force; over long distances the sustained force decides."]]},
rsi:{use:["Opvolger van de Strain Index (Garg 2017) voor hand, pols en elleboog bij krachtig repeterend werk. Alle vijf factoren zijn getallen, niet categorieën, zodat kleine verbeteringen zichtbaar worden. Kies RSI als je frequentie en duur per inspanning kunt tellen; anders HARM of ART.","Successor of the Strain Index (Garg 2017) for hand, wrist and elbow in forceful repetitive work. All five factors are numbers, not categories, so small improvements become visible. Choose RSI when you can count frequency and duration per exertion; otherwise HARM or ART."],
  prep:[["Film een paar minuten van dichtbij. Tel de inspanningen per minuut (elke keer grijpen, knijpen, duwen) en meet hoe lang één inspanning duurt. Vraag de medewerker de zwaarste inspanning te scoren op Borg CR-10. Schat de polshoek van de foto (buigen of strekken).","Film a few minutes up close. Count the exertions per minute (each grip, pinch, push) and measure how long one exertion lasts. Ask the worker to rate the heaviest exertion on Borg CR-10. Estimate the wrist angle from the photo (flexion or extension)."]],
  steps:[[["Borg 2 = licht, 3 = matig, 5 = zwaar, 7 = zeer zwaar. Bij een kortstondige handeling (typen, pakken) is de duur per inspanning ongeveer 0,5 s.","Borg 2 = light, 3 = moderate, 5 = hard, 7 = very hard. For a brief action (typing, picking) the duration per exertion is about 0.5 s."],["Uren per dag: de netto tijd met deze handeling, ook bij taakroulatie.","Hours per day: the net time with this operation, also with job rotation."]]],
  read:[["RSI ≤ 10 is volgens Garg veilig, > 10 gevaarlijk. Ergonomiesite gebruikt daarnaast 3–10 als aandachtszone. Frequentie en duur per inspanning tellen lineair: halveren van het aantal inspanningen halveert bijna de score.","RSI ≤ 10 is safe according to Garg, > 10 hazardous. Ergonomiesite also uses 3–10 as an attention zone. Frequency and duration per exertion count linearly: halving the number of exertions nearly halves the score."]],
  err:[["De cyclustijd invullen als duur per inspanning.","Entering the cycle time as duration per exertion."]]},
mapo:{use:["MAPO beoordeelt niet één transfer maar een hele afdeling: hoeveel niet- en deels coöperatieve patiënten per medewerker, en of tilliften, kleine hulpmiddelen, rolstoelen, ruimtes en opleiding op orde zijn. Gebruik het per afdeling of woongroep, jaarlijks en na investeringen.","MAPO assesses not one transfer but a whole ward: how many non- and partially cooperative patients per worker, and whether hoists, minor aids, wheelchairs, rooms and training are in order. Use it per ward or living group, yearly and after investments."],
  prep:[["Interview de hoofdverpleegkundige (aantal patiënten per mobiliteitsklasse, medewerkers per dienst, opleiding) en loop daarna de afdeling rond: hulpmiddelen, rolstoelen, badkamers, toiletten en kamers tellen en gebreken noteren.","Interview the head nurse (patients per mobility class, staff per shift, training) and then walk the ward: count aids, wheelchairs, bathrooms, toilets and rooms and note the defects."]],
  steps:[[["NC = niet-coöperatief (moet volledig getild worden), PC = deels coöperatief (kan deels meewerken). OP = het totaal van de medewerkers die transfers doen over de drie diensten van een etmaal, bv. 5 + 4 + 2 = 11.","NC = non-cooperative (must be fully lifted), PC = partially cooperative (can partly assist). OP = the total of workers doing transfers over the three shifts of a day, e.g. 5 + 4 + 2 = 11."]],
   [["Voldoende tilliften = minstens één per 8 NC-patiënten; adequaat = minstens 90 % van de NC-transfers gaat met een lift en de bedden zijn in hoogte verstelbaar met wegneembare sponden. Rolstoelen: tel per type de gebreken en middel gewogen over het aantal stoelen.","Sufficient hoists = at least one per 8 NC patients; adequate = at least 90 % of NC transfers use a hoist and the beds are height-adjustable with removable rails. Wheelchairs: count the defects per type and average weighted by the number of chairs."]],
   [["Bereken per type badkamer, toilet en kamer het aantal gebreken, weeg met het aantal ruimtes en vul de drie gemiddelden in. Opleiding is pas adequaat bij minstens 6 uur theorie én praktijk voor 90 % van de medewerkers in de laatste twee jaar.","Per type of bathroom, toilet and room count the defects, weight by the number of rooms and enter the three means. Training is only adequate with at least 6 hours of theory and practice for 90 % of workers in the last two years."]]],
  read:[["0,1–1,5 verwaarloosbaar; 1,51–5 gemiddeld (plan op middellange termijn); > 5 hoog (korte termijn maatregelen en gezondheidsbewaking). De rijen laten zien welke factor het meest vermenigvuldigt.","0.1–1.5 negligible; 1.51–5 medium (medium-term plan); > 5 high (short-term measures and health surveillance). The rows show which factor multiplies most."]],
  err:[["Alleen de ochtenddienst tellen als OP.","Counting only the morning shift as OP."]]},
ptai:{use:["PTAI volgt één medewerker bij één transfer: negen observatiepunten met elk drie criteria, plus zes interviewvragen. Goed om per transfer te laten zien wat beter kan en om na training of nieuwe hulpmiddelen opnieuw te meten.","PTAI follows one worker in one transfer: nine observed points with three criteria each, plus six interview questions. Good for showing per transfer what can improve and for re-measuring after training or new aids."],
  prep:[["Observeer de transfer zoals die echt gebeurt (eventueel filmen) en loop de drie criteria per punt af. Doe daarna het korte interview met de medewerker.","Observe the transfer as it really happens (film if possible) and go through the three criteria per point. Then do the short interview with the worker."]],
  steps:[[["Per punt: alle drie criteria in orde = in orde; één of twee = deels; geen = niet in orde. Bij een transfer met tillift zet je kleine hulpmiddelen en afstand/hoogte op N.v.t.","Per point: all three criteria OK = OK; one or two = partly; none = not OK. For a hoist transfer set minor aids and distance/height to N/a."]],
   [["Laat de medewerker zelf antwoorden; ervaren belasting en frequentie (> 15 kg hulp) zijn schattingen van de medewerker.","Let the worker answer; perceived load and frequency (> 15 kg assistance) are the worker's estimates."]]],
  read:[["Index > 80 % aanvaardbaar (instructies volstaan), 60–80 % zwaar werk (maatregelen nodig), < 60 % niet in orde (direct actie). De lijst toont de punten die deels of niet in orde zijn.","Index > 80 % acceptable (instructions suffice), 60–80 % heavy work (measures needed), < 60 % not OK (immediate action). The list shows the points that are partly or not OK."]],
  err:[["Meerdere transfers in één beoordeling mengen; maak per transfer een beoordeling.","Mixing several transfers in one assessment; make one assessment per transfer."]]},
carry:{use:["Snelle grens voor dragen: hoeveel kilo mag in totaal gedragen worden in een periode, uit afstand, handhoogte, verzwarende factoren en één of twee handen (ergonomiesite.be, naar ISO 11228-1). Handig naast NIOSH of KIM-LHC, die vooral het gewicht per keer beoordelen.","Quick limit for carrying: how many kilos may be carried in total in a period, from distance, hand height, aggravating factors and one or two hands (ergonomiesite.be, per ISO 11228-1). Useful alongside NIOSH or KIM-LHC, which mainly judge the load per carry."],
  prep:[["Bepaal de periode (hoeveel uur per dag wordt gedragen), de loopafstand per keer, de handhoogte en het aantal keer dragen.","Determine the period (how many hours per day carrying occurs), the walking distance per carry, the hand height and the number of carries."]],
  steps:[[["Kies bij een korte taak (< 30 min per dag) de grens per minuut en vul dan ook het aantal keer per minuut in. Verzwarende factoren: slechte grip, romptorsie, last breder dan 40 cm, beperkte houding, instabiele last, beperkt zicht.","For a short task (< 30 min per day) choose the per-minute limit and then also enter the number of carries per minute. Aggravating factors: poor grip, trunk twist, load wider than 40 cm, restricted posture, unstable load, limited view."]],
   [["Gewicht per keer × aantal keer in de gekozen periode = werkelijk gedragen.","Load per carry × number of carries in the chosen period = actually carried."]]],
  read:[["Verhouding ≤ 0,8 groen, 0,8–1 oranje (weinig marge), > 1 rood. Verder dan 20 m of handen boven 175 cm: niet aanvaardbaar, gebruik een kar.","Ratio ≤ 0.8 green, 0.8–1 amber (little margin), > 1 red. Beyond 20 m or hands above 175 cm: not acceptable, use a cart."]],err:[]},
es_lift:{use:["Ergoscore is een knelpuntenmethode van ergonomiesite.be: per belasting vier factoren (tijd, intensiteit, houding, omstandigheden) met 5, 10, 25 of 50 punten. Elke factor heeft een ingebouwde grenswaarde (50 punten), zodat één slechte factor alleen al tot maatregelen leidt. Bedoeld om samen met de medewerkers en de leidinggevende in te vullen; analyseniveau, geen expertniveau.","Ergoscore is a bottleneck method from ergonomiesite.be: per load four factors (time, intensity, posture, conditions) with 5, 10, 25 or 50 points. Every factor has a built-in limit (50 points), so one bad factor alone leads to measures. Meant to be filled in with the workers and the supervisor; analysis level, not expert level."],
  prep:[["Bekijk de taak samen met de medewerker en kies per factor de omschrijving die het best past; de getallen in de opties (kg, cm, minuten) zijn de grenzen.","Look at the task together with the worker and pick per factor the description that fits best; the numbers in the options (kg, cm, minutes) are the limits."]],
  steps:[[["Bij tillen telt van rug en schouders alleen de hoogste; bij vermoeiend werk is herstel een vermenigvuldiger. Bij trekken en duwen kies je eerst het transportmiddel: de gewichtsgrenzen hangen daarvan af.","In lifting only the higher of back and shoulders counts; in fatiguing work recovery is a multiplier. In pushing and pulling first pick the transport aid: the weight limits depend on it."]]],
  read:[["≤ 50 laag risico, 51–74 verhoogd, ≥ 75 maatregelen noodzakelijk (minstens één grenswaarde overschreden), ≥ 100 niet aanvaardbaar. Pak eerst de factor met 50 punten aan.","≤ 50 low risk, 51–74 increased, ≥ 75 measures necessary (at least one limit exceeded), ≥ 100 not acceptable. Address the 50-point factor first."]],
  err:[["De gunstigste variant kiezen in plaats van de gebruikelijke situatie.","Choosing the most favourable variant instead of the usual situation."]]},
inrs:{use:["De INRS-analyse (Frankrijk, ED 6161) licht een hele taak door in vijf domeinen: fysieke belasting, afmetingen en houding, tijd, omgeving en organisatie. Elk item krijgt 0, +, ++ of +++. Het resultaat is een profiel dat laat zien in welk domein de knelpunten zitten; er is geen totaalscore.","The INRS analysis (France, ED 6161) screens a whole task over five domains: physical load, dimensions and posture, time, environment and organisation. Each item gets 0, +, ++ or +++. The result is a profile showing in which domain the issues lie; there is no total score."],
  prep:[["Observeer de taak en spreek met de medewerkers; veel items (regelmogelijkheden, pauzes, werkdruk) hoor je alleen van hen.","Observe the task and talk to the workers; many items (control, breaks, work pressure) you only hear from them."]],
  steps:[[["Vul de tonnage in voor de duur die past: gewicht × aantal keer per uur, in ton. Bij trekken en duwen kies je eerst het middel.","Enter the tonnage for the matching duration: weight × times per hour, in tonnes. In pushing and pulling first pick the aid."]],[["Beoordeel wat je ziet tijdens de taak, niet de uitzondering.","Judge what you see during the task, not the exception."]],[["Tempogebonden, blootstellingsduur en hersteltijd wegen zwaar in de Franse praktijk.","Paced work, exposure duration and recovery time weigh heavily in French practice."]],[["Trillingen: gebruik de waarden van de fabrikant of een meting (actiewaarden 0,5 en 2,5 m/s²).","Vibration: use the manufacturer's values or a measurement (action values 0.5 and 2.5 m/s²)."]],[["Organisatie-items gaan over de hele dag, niet over één handeling.","Organisation items concern the whole day, not one action."]]],
  read:[["Het stoplicht in ErgoFlow is het zwaarste item (+++ rood, ++ oranje, + geel); de rijen tonen per domein het aantal items op ++ of hoger, en de +++-items staan als knelpunt genoemd. Werk rode en oranje items uit met de specifieke methode.","The traffic light in ErgoFlow is the worst item (+++ red, ++ amber, + yellow); the rows show per domain the number of items at ++ or higher, and the +++ items are listed as issues. Work out red and amber items with the specific method."]],err:[]},
rab:{use:["Werkplekbezoek beeldschermwerk per medewerker (Belgische praktijk, vijfjaarlijkse risicoanalyse): 58 punten over stoel, tafel, scherm, toetsenbord en muis, zitgedrag, omgeving en veiligheid, met de wettelijke minimumeisen voor de stoel. Stel tijdens het bezoek zoveel mogelijk direct in.","Screen-work workplace visit per worker (Belgian practice, five-yearly risk analysis): 58 points on chair, desk, screen, keyboard and mouse, sitting behaviour, environment and safety, with the legal minimum for the chair. Adjust as much as possible during the visit."],
  prep:[["Ga bij de medewerker zitten, probeer de stoel en tafel zelf en meet zo nodig ellebooghoogte en tafelhoogte.","Sit with the worker, try the chair and desk yourself and if needed measure elbow height and desk height."]],
  steps:[[["Vink aan wat niet in orde is. Zithoogte, hoogte en helling van de rugleuning zijn het wettelijk minimum: één daarvan niet regelbaar = rood.","Tick what is not OK. Seat height, backrest height and tilt are the legal minimum: one of them not adjustable = red."]],[["Stel de stoel meteen goed in; wat je nu niet doet, gebeurt later meestal niet meer.","Adjust the chair right away; what you do not do now usually never happens."]],[["Vaste tafel van 74 cm is neutraal; te diep of te weinig beenruimte is niet in orde.","A fixed 74 cm desk is neutral; too shallow or too little leg room is not OK."]],[["Blokjes onder de poten of een voetensteun bij een niet-verstelbare tafel.","Blocks under the legs or a footrest for a non-adjustable desk."]],[["Laptop: standaard een groot scherm plus los toetsenbord en muis.","Laptop: a large screen plus separate keyboard and mouse as standard."]],[["Muis dicht bij het lichaam; een documenthouder bij veel overtypen.","Mouse close to the body; a document holder when copying a lot."]],[["Zitgedrag: vraag het de medewerker; niemand ziet dit tijdens een rondgang.","Sitting behaviour: ask the worker; nobody sees this during a visit."]],[["Ruimte: 2 m dieptezicht ontspant de ogen.","Space: 2 m depth of view relaxes the eyes."]],[["Verlichting: gemiddeld 500 lux, gelijkmatig, zonwering tegen verblinding.","Lighting: average 500 lux, even, sun shading against glare."]],[["Klimaat: comfort 21–23 °C, geen tocht, voldoende verse lucht.","Climate: comfort 21–23 °C, no draught, enough fresh air."]],[["Geluid: normale communicatie op 1 m; kantoortuin max. 55 dB.","Noise: normal conversation at 1 m; open-plan office max. 55 dB."]],[["Kabels gebundeld en geïsoleerd, geen overbelaste stopcontacten.","Cables bundled and insulated, no overloaded sockets."]]],
  read:[["Rood = stoel voldoet niet aan het wettelijk minimum (nieuwe stoel volgens EN 1335 heeft voorrang). Oranje = aandachtspunten; de rijen tonen per onderdeel hoeveel punten niet in orde zijn. Bundel de lijsten per afdeling om investeringen te prioriteren.","Red = chair does not meet the legal minimum (a new EN 1335 chair takes priority). Amber = attention points; the rows show per section how many points are not OK. Bundle the lists per department to prioritise investments."]],err:[]}});
['es_push','es_rep','es_care','es_stand','es_kneel','es_sit','es_screen','es_post','es_fatigue'].forEach(id=>MAN[id]=MAN.es_lift);

function viewMethods(){ setBar(T('Methoden','Methods'),'#/');
  const tierDesc={screen:['grof, zonder score: bepaalt wat verder moet.','coarse, no score: decides what needs a closer look.'],quick:['observeren en kiezen uit categorieën, 10–20 min per taak; goed genoeg voor de meeste RI&E-vragen.','observe and pick from categories, 10–20 min per task; good enough for most risk-inventory questions.'],calc:['meetlint, weegschaal, dynamometer of filmpje; geeft grenswaarden of kansen en onderbouwt maatregelen het sterkst.','tape measure, scale, dynamometer or video; gives limits or probabilities and justifies measures most strongly.'],snapshot:['één moment, meestal van een foto; zegt niets over duur of frequentie.','one moment, usually from a photo; says nothing about duration or frequency.'],ext:['niet in de app nagebouwd; je legt alleen de uitkomst vast.','not reproduced in the app; you only record the result.']};
  const card=m=>`<div class="mcard"><div class="row" style="align-items:flex-start"><div class="grow"><b>${esc(tr(m.name))}</b> <span class="tag ${m.ext?'ext':''}">${m.ext?T('extern','external'):T('in app','in app')}</span><br><span class="small">${esc(tr(WHEN[m.id]||m.scope))}</span></div>${MAN[m.id]?`<button class="btn sm" data-man="${m.id}">${T('Uitleg','Guide')}</button>`:''}</div>${m.link?`<a class="small" href="${m.link}" target="_blank" rel="noopener">${esc(m.link.replace(/^https?:\/\//,'').split('/')[0])} ↗</a>`:''}</div>`;
  $('#view').innerHTML=`<section class="card"><h2>${T('Welke methode wanneer?','Which method when?')}</h2>
    <p class="gp">${T('Werk in drie stappen. (1) Screen de taak met de vragen op de taakpagina. (2) Kies per aanwezige belasting één snelle methode; het advies per groep hieronder zegt welke. (3) Meet en bereken alleen waar de snelle methode oranje of rood geeft, of waar je een grenswaarde nodig hebt om een maatregel te onderbouwen.','Work in three steps. (1) Screen the task with the questions on the task page. (2) Pick one quick method per load present; the advice per group below says which. (3) Measure and calculate only where the quick method gives amber or red, or where you need a limit to justify a measure.')}</p>
    <ul class="glist" style="margin-top:10px">${['screen','quick','calc','snapshot','ext'].map(t=>`<li><b>${esc(tr(TIER[t]))}</b> — ${esc(tr(tierDesc[t]))}</li>`).join('')}</ul>
    <p class="gp" style="margin-top:10px">${T('Vuistregels: gebruik voor vergelijkbare taken steeds dezelfde methode; de Nederlandse praktijk is NIOSH voor tillen, KIM-PP of DUTCH voor duwen/trekken, HARM voor hand-arm en WHI voor houdingen; bij klachten altijd een deskundige betrekken.','Rules of thumb: use the same method for comparable tasks; Dutch practice is NIOSH for lifting, KIM-PP or DUTCH for push/pull, HARM for hand-arm and WHI for postures; with complaints always involve an expert.')}</p></section>
    ${GROUPS.map(([g,l])=>{ const ms=Object.values(M).filter(m=>m.group===g); return `<section class="card"><h2>${esc(tr(l))}</h2>${CHOOSE[g]?`<p class="advice">${esc(tr(CHOOSE[g]))}</p>`:''}${['screen','quick','calc','snapshot','ext'].filter(t=>ms.some(m=>m.tier===t)).map(t=>`<div class="mgroup">${esc(tr(TIER[t]))}</div>`+ms.filter(m=>m.tier===t).map(card).join('')).join('')}</section>`; }).join('')}
    <p class="ref">${T('Gevalideerde methoden zijn nagebouwd uit de gepubliceerde formulieren, tabellen en artikelen; de bron staat bij elke methode onder de uitleg.','Validated methods are reproduced from the published forms, tables and papers; the source is listed with every method under the guide.')}</p>`;
  $('#view').onclick=e=>{ const b=e.target.closest('[data-man]'); if(b) manualSheet(M[b.dataset.man]); }; }

/* ===== Inventory guide page (#/i), after the OBAMA steps of ergonomiesite.be ===== */
function viewInventory(){ setBar(T('Inventariseren','Taking stock'),'#/');
  const sec=(h,items)=>`<section class="card"><h2>${h}</h2><ul class="glist">${items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
  $('#view').innerHTML=`<section class="card"><h2>${T('Eerst inventariseren, dan analyseren','Take stock first, then analyse')}</h2><p class="gp">${T('Een risicoanalyse ergonomie loopt in vijf stappen (ergonomiesite.be, OBAMA): Opsporen, Bespreken, Analyseren, Meten, Aanpakken. ErgoFlow ondersteunt ze alle vijf. Deze pagina helpt je met de eerste twee, zodat je daarna de juiste methode kiest en niet alles hoeft door te rekenen.','An ergonomics risk assessment runs in five steps (ergonomiesite.be, OBAMA): screen, discuss, analyse, measure, act. ErgoFlow supports all five. This page helps with the first two, so that you then choose the right method and do not have to calculate everything.')}</p></section>
  ${sec('1 · '+T('Opsporen: de werkplek in kaart','Screen: map the workplace'),[
    T('Kies een afgebakende taak of functie, geen hele afdeling. Maak per taak één taak in ErgoFlow.','Choose one delimited task or job, not a whole department. Create one task in ErgoFlow per task.'),
    T('Kijk minstens één volledige cyclus of 15 minuten mee, liefst bij twee medewerkers en op een druk moment. Film met je telefoon: tellen achteraf is makkelijker en eerlijker.','Watch at least one full cycle or 15 minutes, preferably two workers and at a busy moment. Film with your phone: counting afterwards is easier and fairer.'),
    T('Maak foto\'s van opzij en van voren op de zwaarste momenten (onderste laag pallet, hoogste stapel, achterste rek). Vervaag gezichten in de foto-editor.','Take photos from the side and the front at the heaviest moments (bottom pallet layer, highest stack, furthest rack). Blur faces in the photo editor.'),
    T('Loop de Ergonomie Check op de taakpagina door: 13 vragen met een drempel (bv. tillen > 3 kg, repetitief > 10 handelingen per minuut, staan > 2 uur). Bij twijfel: ja. Je beoordeelt hier nog niets; je spoort alleen op.','Go through the Ergonomie Check on the task page: 13 questions with a threshold (e.g. lifting > 3 kg, repetitive > 10 actions per minute, standing > 2 h). When in doubt: yes. You are not assessing anything yet; only screening.'),
    T('Noteer de basisgegevens: aantal medewerkers, uren per dag aan deze taak, ploegen, roulatie. Die bepalen later de duurfactoren van elke methode.','Note the basics: number of workers, hours per day on this task, shifts, rotation. These later set the duration factors of every method.')]) }
  ${sec('2 · '+T('Bespreken: met de medewerkers','Discuss: with the workers'),[
    T('De medewerkers zijn de experts van hun taak. Bespreek per aanwezig risico vier dingen (Focus Ergonomie): Tijd — hoe lang, hoe vaak, hoe ver? Intensiteit — hoe zwaar, hoeveel kracht? Houding — bukken, reiken, draaien, knielen? Omstandigheden — ruimte, grip, vloer, klimaat, tempo?','The workers are the experts of their task. Per risk present, discuss four things (Focus Ergonomie): Time — how long, how often, how far? Intensity — how heavy, how much force? Posture — bending, reaching, twisting, kneeling? Conditions — space, grip, floor, climate, pace?'),
    T('Vraag bij elk knelpunt meteen naar een idee voor een oplossing; die komen vaak uit dit gesprek. Leg beide vast in het blok "Bespreken" op de taakpagina; ze komen in het rapport.','At every issue ask straight away for a solution idea; these often come from this conversation. Record both in the "Discuss" block on the task page; they appear in the report.'),
    T('Vraag ook naar klachten en naar wat op een slechte dag anders is (storingen, ander product, uitval van hulpmiddelen).','Also ask about complaints and about what is different on a bad day (breakdowns, other product, aids out of order).')]) }
  ${sec('3 · '+T('Analyseren: kies per risico één methode','Analyse: pick one method per risk'),[
    T('Elk aangevinkt risico toont knoppen met passende methoden. Begin met de snelle methode (KIM, HARM, WHI, MAC): 10–20 minuten, geen meetlint.','Every ticked risk shows buttons with suitable methods. Start with the quick method (KIM, HARM, WHI, MAC): 10–20 minutes, no tape measure.'),
    T('Gebruik voor vergelijkbare taken steeds dezelfde methode, anders zijn de scores niet te vergelijken. De pagina Methoden legt uit wat wanneer past.','Use the same method for comparable tasks, otherwise scores cannot be compared. The Methods page explains what fits when.'),
    T('Meerdere momenten of deeltaken? NIOSH, LiFFT, DUET, OWAS, REBA en RULA nemen meerdere tilhandelingen, taken of houdingen in één beoordeling; voor de andere methoden maak je per deeltaak een beoordeling met een kenmerk (bv. "onderste laag").','Several moments or sub-tasks? NIOSH, LiFFT, DUET, OWAS, REBA and RULA take several lifts, tasks or postures in one assessment; for the other methods make one assessment per sub-task with a label (e.g. "bottom layer").')]) }
  ${sec('4 · '+T('Meten: alleen waar het loont','Measure: only where it pays'),[
    T('Meet en bereken (NIOSH, DUTCH, Strain Index, Ohio, Liberty Mutual) waar de snelle methode oranje of rood geeft, of waar je een grenswaarde nodig hebt om een investering te onderbouwen.','Measure and calculate (NIOSH, DUTCH, Strain Index, Ohio, Liberty Mutual) where the quick method gives amber or red, or where you need a limit to justify an investment.'),
    T('Neem mee: rolmaat, weegschaal of etiketgewicht, stopwatch of teller, eventueel dynamometer voor duwen en trekken.','Bring: tape measure, scale or label weight, stopwatch or counter, possibly a dynamometer for pushing and pulling.')]) }
  ${sec('5 · '+T('Aanpakken en opnieuw beoordelen','Act and re-assess'),[
    T('Leg maatregelen vast in de volgorde van de arbeidshygiënische strategie: bron, collectief/technisch, organisatorisch, persoonlijk. Geef elke maatregel een eigenaar en datum.','Record measures in the order of the hierarchy of controls: source, collective/technical, organisational, personal. Give every measure an owner and a date.'),
    T('Gebruik "Opnieuw beoordelen na maatregelen" om dezelfde methode na de verandering nog eens in te vullen; het rapport zet voor en na naast elkaar.','Use "Re-assess after measures" to fill in the same method again after the change; the report puts before and after side by side.')]) }
  <p class="ref">${T('Naar: Ergonomie Check, Focus Ergonomie en Risicoanalyse ergonomie (R. Motmans, ergonomiesite.be).','After: Ergonomie Check, Focus Ergonomie and Risicoanalyse ergonomie (R. Motmans, ergonomiesite.be).')} <a href="https://www.ergonomiesite.be/risicoanalyse/" target="_blank" rel="noopener">ergonomiesite.be/risicoanalyse ↗</a></p>`; }

/* ---- assessment view ---- */
function fieldHtml(f,ctx,path){ if(f.show&&!f.show(ctx)) return ''; const v=ctx[f.k], a=`data-k="${f.k}"${path}`, help=f.h?`<span class="help">${esc(tr(f.h))}</span>`:'';
  if(f.t==='hdr') return `<h3 class="ih">${esc(tr(f.l))}</h3>`;
  if(f.t==='chk') return `<label class="chk"><input type="checkbox" ${a} ${v?'checked':''}><span>${esc(tr(f.l))}</span></label>`;
  if(f.t==='num') return `<label class="fld"><span class="lbl">${esc(tr(f.l))}</span><span class="numwrap"><input type="number" inputmode="decimal" ${a} value="${esc(v??'')}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} step="${f.step||'any'}">${f.unit?`<span class="unit">${esc(tr(f.unit))}</span>`:''}</span>${help}</label>`;
  if(f.t==='text') return `<label class="fld"><span class="lbl">${esc(tr(f.l))}</span><input type="text" ${a} value="${esc(v??'')}"></label>`;
  if(f.t==='sel') return `<label class="fld"><span class="lbl">${esc(tr(f.l))}</span><select ${a}>${f.o.map(o=>`<option value="${o[0]}" ${String(v)===String(o[0])?'selected':''}>${esc(tr(o[1]))}</option>`).join('')}</select>${help}</label>`;
  if(f.t==='seg') return `<div class="fld"><span class="lbl">${esc(tr(f.l))}</span><div class="seg" role="group">${f.o.map(o=>`<button type="button" ${a} data-v="${o[0]}" aria-pressed="${String(v)===String(o[0])}">${esc(tr(o[1]))}</button>`).join('')}</div>${help}</div>`;
  if(f.t==='list'){ const arr=ctx[f.k]||[]; return arr.map((it,n)=>`<div class="sub"><div class="row"><b class="grow">${esc(tr(f.l))} ${n+1}</b>${arr.length>1?`<button class="btn sm ghost danger" data-lrem="${f.k}" data-idx="${n}">${T('Verwijder','Remove')}</button>`:''}</div>${f.item.map(s=>fieldHtml(s,it,` data-list="${f.k}" data-idx="${n}"`)).join('')}</div>`).join('')+`<button class="btn sm" data-ladd="${f.k}">${ico('plus')}${esc(tr(f.add))}</button> <span class="small muted">${T('start met de waarden van de vorige','starts with the values of the previous one')}</span>`; }
  return ''; }
function railHtml(r){ const hasNum=typeof r.score==='number'&&isFinite(r.score);
  let g=''; if(r.scale&&typeof r.score==='number'){ let prev=0; const mx=r.scale.max; g='<div class="gauge">'+r.scale.cuts.map(([at,b])=>{ const w=(at-prev)/mx*100; prev=at; return `<span class="b-${b}" style="width:${w}%"></span>`; }).join('')+`<i style="left:${Math.min(100,Math.max(0,(hasNum?r.score:mx)/mx*100))}%"></i></div>`; }
  const rows=(r.rows||[]).map(x=>`<div class="rrow"><span class="dot ${x.band?'b-'+x.band:''}"></span><span class="grow">${esc(tr(x.l))}</span><span class="muted">${esc(x.v===undefined?'':fmtN(x.v))}</span></div>`).join('');
  const parts=(r.parts||[]).length?`<h3 style="margin:12px 0 8px">${esc(tr(r.partsTitle||['Opbouw van de score','What drives the score']))}</h3>`+r.parts.map(p=>`<div class="part"><span>${esc(tr(p.l))}</span><span class="muted">${esc(p.txt||fmtN(r1(p.v))+(p.max?' / '+fmtN(p.max):''))}</span><span class="track"><b style="width:${Math.min(100,Math.max(0,(p.pen!==undefined?p.pen:p.v/p.max)*100))}%"></b></span></div>`).join(''):'';
  return {head:`<span class="big">${esc(scoreText(r))}${r.score!==null&&r.score!==undefined?`<small>${esc(r.label||T('punten','points'))}</small>`:''}</span><span class="grow verdict">${chip(r)}</span>`,gauge:g,
    more:(r.formula?`<p class="small muted" style="margin:0 0 8px">${T('Berekening','Calculation')}: ${esc(fmtN(r.formula))}</p>`:'')+rows+parts+(r.notes||[]).map(n=>`<p class="note">${esc(tr(n))}</p>`).join('')+(r.flags||[]).map(f=>`<div class="flag">${esc(tr(f))}</div>`).join('')}; }
function viewEval(id){ const e=getEval(id), m=M[e.method], t=getTask(e.taskId); $('#view').className='wide';
  setBar(tr(m.short)+' — '+(t.title||T('taak','task')),'#/t/'+t.id,`<button id="guide">${ico('help')}<span>${T('Uitleg','Guide')}</span></button>`);
  $('#view').innerHTML=`<div class="evalgrid"><div>
    <section class="card"><h2>${esc(tr(m.name))} ${m.ext?`<span class="tag ext">${T('extern','external')}</span>`:''}</h2><p class="small muted" style="margin:0 0 12px">${esc(tr(m.scope))}${m.link?` <a href="${m.link}" target="_blank" rel="noopener">${m.ext?T('Open de tool ↗','Open the tool ↗'):/tno\.nl/.test(m.link)?T('Open TNO-tool ↗','Open TNO tool ↗'):T('Bron ↗','Source ↗')}</a>`:''} <button class="btn sm ghost" id="guide2" style="height:auto;padding:0">${T('Hoe vul ik dit in?','How do I fill this in?')}</button></p>
      <div class="fgrid"><div class="fld"><span class="lbl">${T('Situatie','Situation')}</span><div class="seg"><button data-ph="before" aria-pressed="${e.phase==='before'}">${phaseName('before')}</button><button data-ph="after" aria-pressed="${e.phase==='after'}">${phaseName('after')}</button></div></div>
      <label class="fld"><span class="lbl">${T('Kenmerk (optioneel)','Label (optional)')}</span><input type="text" id="elabel" value="${esc(e.label)}" placeholder="${T('bv. rechterhand, lijn 3','e.g. right hand, line 3')}"></label></div></section>
    <div id="steps"></div>
    <section class="card"><h2>${T('Foto\'s bij deze beoordeling','Photos for this assessment')}</h2><div class="photos" id="ephotos"></div></section>
    <section class="card"><label class="fld" style="margin:0"><span class="lbl">${T('Toelichting','Notes')}</span><textarea id="enotes">${esc(e.notes)}</textarea></label><p class="ref">${esc(m.ref)}</p></section>
    <div class="row noprint" style="flex-wrap:wrap">${e.phase==='before'?`<button class="btn" id="redo">${T('Opnieuw beoordelen na maatregelen','Re-assess after measures')}</button>`:''}<span class="grow"></span><button class="btn danger" id="dele">${T('Beoordeling verwijderen','Delete assessment')}</button></div>
  </div><aside class="rail" id="rail"><button class="railhead" id="railhead" aria-expanded="false"></button><div id="railgauge"></div><div class="more" id="railmore"></div></aside></div>`;
  const isOpen=n=>helpAll!==helpOpen.has(m.id+n);
  const steps=()=>{ $('#steps').innerHTML=m.steps.map((s,n)=>`<section class="card step"><h2><span class="n">${n+1}</span><span class="grow">${esc(tr(s.title))}</span><button type="button" class="helpbtn" data-help="${n}" aria-expanded="${isOpen(n)}" aria-label="${T('Uitleg bij deze stap','Guidance for this step')}">?</button></h2>${isOpen(n)?stepGuide(m,n):''}${s.fields.map(f=>fieldHtml(f,e.inputs,'')).join('')}</section>`).join(''); };
  const rail=(save=true)=>{ e.result=m.calc(e.inputs); const h=railHtml(e.result); $('#railhead').innerHTML=h.head; $('#railgauge').innerHTML=h.gauge; $('#railmore').innerHTML=h.more; if(save) saveSoon('evals',e); };
  steps(); rail(false);   /* rendering must never write: a write broadcasts a change to every other window and device */ renderPhotos($('#ephotos'),t.id,e.id);
  $('#guide').onclick=$('#guide2').onclick=()=>manualSheet(m,steps);
  $('#railhead').onclick=()=>{ const o=$('#rail').classList.toggle('open'); $('#railhead').setAttribute('aria-expanded',o); };
  const target=el=>el.dataset.list?e.inputs[el.dataset.list][+el.dataset.idx]:e.inputs;
  $('#steps').oninput=ev=>{ const el=ev.target; if(el.dataset.k&&(el.type==='number'||el.type==='text')){ target(el)[el.dataset.k]=el.value; rail(); } };
  $('#steps').onchange=ev=>{ const el=ev.target; if(!el.dataset.k) return; if(el.type==='checkbox'){ target(el)[el.dataset.k]=el.checked; steps(); rail(); } else if(el.tagName==='SELECT'){ target(el)[el.dataset.k]=el.value; steps(); rail(); } };
  $('#steps').onclick=ev=>{ const b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.help!==undefined){ const k=m.id+b.dataset.help; helpOpen.has(k)?helpOpen.delete(k):helpOpen.add(k); steps(); return; }
    if(b.dataset.v!==undefined&&b.dataset.k){ target(b)[b.dataset.k]=b.dataset.v; steps(); rail(); }
    else if(b.dataset.ladd){ const f=m.steps.flatMap(s=>s.fields).find(f=>f.k===b.dataset.ladd), arr=e.inputs[f.k]||(e.inputs[f.k]=[]), prev=arr[arr.length-1], it={}; f.item.forEach(s=>{ if(s.def!==undefined) it[s.k]=s.def; }); if(prev) Object.assign(it,JSON.parse(JSON.stringify(prev))); arr.push(it); steps(); rail(); }
    else if(b.dataset.lrem){ e.inputs[b.dataset.lrem].splice(+b.dataset.idx,1); steps(); rail(); } };
  $$('[data-ph]').forEach(b=>b.onclick=()=>{ e.phase=b.dataset.ph; saveSoon('evals',e); viewEval(id); });
  $('#elabel').oninput=ev=>{ e.label=ev.target.value; saveSoon('evals',e); }; $('#enotes').oninput=ev=>{ e.notes=ev.target.value; saveSoon('evals',e); };
  if($('#redo')) $('#redo').onclick=async()=>{ const ne=await createEval(t.id,e.method,'after',e.inputs,e.label); location.hash='#/e/'+ne.id; };
  $('#dele').onclick=async()=>{ if(!confirm(T('Deze beoordeling verwijderen?','Delete this assessment?')))return; dropSave(e.id); for(const p of photosOf(t.id,e.id)){ p.evalId=null; await Store.put('photos',p); } await Store.del('evals',e.id); S.evals=S.evals.filter(x=>x.id!==e.id); location.hash='#/t/'+t.id; }; }

/* ---- photos ---- */
let photoTarget=null;
function renderPhotos(el,taskId,evalId){ const ps=photosOf(taskId,evalId);
  el.innerHTML=ps.map(p=>`<button class="ph" data-photo="${p.id}" title="${esc(p.caption)}"><img src="${p.thumb}" alt="${esc(p.caption||T('Foto','Photo'))}"></button>`).join('')+`<button class="ph add" data-addphoto>${ico('cam')}<span>${T('Foto','Photo')}</span></button>`;
  el.onclick=ev=>{ const p=ev.target.closest('[data-photo]'); if(p) return openEditor(p.dataset.photo,()=>renderPhotos(el,taskId,evalId));
    if(ev.target.closest('[data-addphoto]')){ photoTarget={el,taskId,evalId}; $('#file').value=''; $('#file').click(); } }; }
$('#file').onchange=async ev=>{ const tg=photoTarget; if(!tg) return; for(const f of ev.target.files){ try{ await addPhoto(f,tg.taskId,tg.evalId); }catch(err){ alert(T('Foto kon niet worden gelezen: ','Could not read photo: ')+f.name); } } renderPhotos(tg.el,tg.taskId,tg.evalId); touchTask(getTask(tg.taskId)); };
async function loadBitmap(blob){ if(window.createImageBitmap){ try{ return await createImageBitmap(blob,{imageOrientation:'from-image'}); }catch(e){} }
  return new Promise((res,rej)=>{ const im=new Image(), u=URL.createObjectURL(blob); im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=rej; im.src=u; }); }
const toBlob=(c,q=.86)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
function scaled(src,max){ const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return c; }
async function addPhoto(file,taskId,evalId){ const bmp=await loadBitmap(file), c=scaled(bmp,1600), full=await toBlob(c);
  const p={id:uid(),taskId,evalId:evalId||null,caption:'',thumb:scaled(c,320).toDataURL('image/jpeg',.8),w:c.width,h:c.height,ann:[],scale:null,created:Date.now()};
  await Store.putBlobs(p,{full,base:full}); S.photos.push(p); await Store.put('photos',p); return p; }

/* ---- photo editor: arrow, angle, ruler, text, blur (burned in) ---- */
const ED={};
async function openEditor(photoId,onClose){ const p=S.photos.find(x=>x.id===photoId); if(!p) return; const bl=await Store.getBlobs(p); if(!bl){ toast(T('Deze foto is nog niet gesynchroniseerd naar dit apparaat.','This photo has not been synced to this device yet.')); return; }
  const base=scaled(await loadBitmap(bl.base||bl.full),4000); Object.assign(ED,{p,base,ann:JSON.parse(JSON.stringify(p.ann||[])),scale:p.scale,tool:'arrow',pts:[],drag:null,undo:[],dirty:false,onClose});
  const tools=[['arrow',T('Pijl','Arrow')],['angle',T('Hoek','Angle')],['ruler',T('Maat','Measure')],['text',T('Tekst','Text')],['blur',T('Vervaag','Blur')]];
  $('#editor').innerHTML=`<div class="top"><button id="edx">${T('Sluit','Close')}</button><button id="eddel">${T('Verwijder','Delete')}</button><span style="flex:1"></span><button id="edsave" style="background:#F2C200;color:#111;border-color:#F2C200">${T('Bewaar','Save')}</button></div>
    <div class="top" style="padding-top:0"><input class="cap" id="edcap" type="text" placeholder="${T('Bijschrift voor het rapport','Caption for the report')}" value="${esc(p.caption)}"></div>
    <div class="stage"><canvas id="edc"></canvas><div class="ask" id="edask"><input type="text" id="edin"><button id="edok">OK</button></div><div class="hint" id="edhint"></div></div>
    <div class="tools">${tools.map(([k,l])=>`<button data-tool="${k}" aria-pressed="${k==='arrow'}">${l}</button>`).join('')}<button id="edundo">${T('Herstel','Undo')}</button></div>`;
  $('#editor').classList.add('on'); const cv=$('#edc'); cv.width=base.width; cv.height=base.height; edHint(); edDraw();
  const pt=ev=>{ const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left)*cv.width/r.width,y:(ev.clientY-r.top)*cv.height/r.height}; };
  cv.onpointerdown=ev=>{ ev.preventDefault(); if($('#edask').classList.contains('on')) return; const q=pt(ev);
    if(ED.tool==='angle'){ ED.pts.push(q); if(ED.pts.length===3){ ED.ann.push({t:'angle',p:ED.pts}); ED.undo.push('ann'); ED.pts=[]; ED.dirty=true; } edHint(); edDraw(); }
    else if(ED.tool==='text'){ edAsk(T('Tekst','Text'),'text',v=>{ if(v){ ED.ann.push({t:'text',a:q,s:v}); ED.undo.push('ann'); ED.dirty=true; edDraw(); } }); }
    else { ED.drag={a:q,b:q}; cv.setPointerCapture(ev.pointerId); } };
  cv.onpointermove=ev=>{ if(ED.drag){ ED.drag.b=pt(ev); edDraw(); } };
  cv.onpointerup=()=>{ const d=ED.drag; ED.drag=null; if(!d) return; const len=Math.hypot(d.b.x-d.a.x,d.b.y-d.a.y); if(len<edU()*6){ edDraw(); return; }
    if(ED.tool==='arrow'){ ED.ann.push({t:'arrow',a:d.a,b:d.b}); ED.undo.push('ann'); }
    else if(ED.tool==='ruler'){ const add=()=>{ ED.ann.push({t:'ruler',a:d.a,b:d.b}); ED.undo.push('ann'); edHint(); edDraw(); };
      if(!ED.scale) edAsk(T('Werkelijke lengte van deze lijn in cm (referentie)','Real length of this line in cm (reference)'),'number',v=>{ const n=num(v); if(n>0){ ED.scale=n/len; add(); } else edDraw(); }); else add(); }
    else if(ED.tool==='blur'){ const x=Math.round(Math.min(d.a.x,d.b.x)),y=Math.round(Math.min(d.a.y,d.b.y)),w=Math.round(Math.abs(d.b.x-d.a.x)),h=Math.round(Math.abs(d.b.y-d.a.y)); if(w>4&&h>4){ const bx=base.getContext('2d'); ED.undo.push({x,y,img:bx.getImageData(x,y,w,h)});
        const bs=Math.max(10,Math.max(w,h)/7), tw=Math.max(1,Math.ceil(w/bs)), th=Math.max(1,Math.ceil(h/bs)), tmp=document.createElement('canvas'); tmp.width=tw; tmp.height=th; const tc=tmp.getContext('2d'); tc.imageSmoothingEnabled=true; tc.drawImage(base,x,y,w,h,0,0,tw,th); bx.imageSmoothingEnabled=false; bx.drawImage(tmp,0,0,tw,th,x,y,w,h); bx.imageSmoothingEnabled=true; } }
    ED.dirty=true; edDraw(); };
  $('#editor .tools').onclick=ev=>{ const b=ev.target.closest('[data-tool]'); if(b){ ED.tool=b.dataset.tool; ED.pts=[]; $$('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x===b)); edHint(); edDraw(); } };
  $('#edundo').onclick=()=>{ if(ED.pts.length){ ED.pts.pop(); } else { const u=ED.undo.pop(); if(u==='ann'){ ED.ann.pop(); if(!ED.ann.some(a=>a.t==='ruler')) ED.scale=null; } else if(u) base.getContext('2d').putImageData(u.img,u.x,u.y); } edHint(); edDraw(); };
  $('#edx').onclick=()=>{ if(ED.dirty&&!confirm(T('Wijzigingen niet bewaren?','Discard changes?'))) return; edClose(); };
  $('#eddel').onclick=async()=>{ if(!confirm(T('Deze foto verwijderen?','Delete this photo?'))) return; await Store.del('photos',p.id); await Store.delBlobs(p); S.photos=S.photos.filter(x=>x.id!==p.id); edClose(); };
  $('#edsave').onclick=async()=>{ const out=document.createElement('canvas'); out.width=base.width; out.height=base.height; const c=out.getContext('2d'); c.drawImage(base,0,0); edPaint(c,ED.ann);
    p.caption=$('#edcap').value; p.ann=ED.ann; p.scale=ED.scale; p.thumb=scaled(out,320).toDataURL('image/jpeg',.8); await Store.putBlobs(p,{full:await toBlob(out),base:await toBlob(base,.9)}); await Store.put('photos',p); edClose(); }; }
function edClose(){ $('#editor').classList.remove('on'); $('#editor').innerHTML=''; const f=ED.onClose; ED.base=null; if(f) f(); }
function edAsk(label,type,cb){ const a=$('#edask'), i=$('#edin'); i.type=type; i.value=''; i.placeholder=label; if(type==='number') i.inputMode='decimal'; a.classList.add('on'); i.focus();
  const done=()=>{ a.classList.remove('on'); cb(i.value.trim()); }; $('#edok').onclick=done; i.onkeydown=e=>{ if(e.key==='Enter') done(); }; }
function edHint(){ const h={arrow:T('Sleep om een pijl te tekenen','Drag to draw an arrow'),angle:[T('Tik het eerste punt (bv. schouder)','Tap the first point (e.g. shoulder)'),T('Tik het draaipunt (bv. elleboog)','Tap the vertex (e.g. elbow)'),T('Tik het derde punt (bv. pols)','Tap the third point (e.g. wrist)')][ED.pts.length],ruler:ED.scale?T('Sleep om een afstand te meten','Drag to measure a distance'):T('Sleep eerst over een bekende lengte als referentie','First drag along a known length as reference'),text:T('Tik waar de tekst moet komen','Tap where the text should go'),blur:T('Sleep over gezichten of naamkaartjes; dit wordt in de foto gebrand','Drag over faces or name tags; this is burned into the photo')}[ED.tool]; $('#edhint').textContent=h+(ED.tool==='angle'||ED.tool==='ruler'?T(' — alleen betrouwbaar bij een foto haaks op het bewegingsvlak',' — only reliable when shot square to the plane of movement'):''); }
const edU=()=>Math.max(ED.base.width,ED.base.height)/420;
function edDraw(){ const cv=$('#edc'); if(!cv) return; const c=cv.getContext('2d'); c.drawImage(ED.base,0,0); const tmp=[...ED.ann]; const d=ED.drag;
  if(d){ if(ED.tool==='blur'){ edPaint(c,tmp); c.save(); c.setLineDash([edU()*3,edU()*3]); c.lineWidth=edU(); c.strokeStyle='#F2C200'; c.strokeRect(d.a.x,d.a.y,d.b.x-d.a.x,d.b.y-d.a.y); c.restore(); return; } tmp.push({t:ED.tool,a:d.a,b:d.b}); }
  edPaint(c,tmp); if(ED.pts.length){ c.fillStyle='#F2C200'; ED.pts.forEach(q=>{ c.beginPath(); c.arc(q.x,q.y,edU()*2.5,0,7); c.fill(); }); } }
function edPaint(c,anns){ const u=edU(), Y='#F2C200', K='rgba(10,16,20,.85)'; c.lineCap='round'; c.lineJoin='round';
  const line=(a,b)=>{ c.strokeStyle=K; c.lineWidth=u*3.2; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); c.strokeStyle=Y; c.lineWidth=u*1.6; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); };
  const label=(s,x,y)=>{ c.font=`600 ${u*9}px system-ui,sans-serif`; const w=c.measureText(s).width+u*8,h=u*14; x=Math.min(Math.max(x-w/2,2),c.canvas.width-w-2); y=Math.min(Math.max(y-h/2,2),c.canvas.height-h-2); c.fillStyle=K; c.beginPath(); c.roundRect?c.roundRect(x,y,w,h,u*3):c.rect(x,y,w,h); c.fill(); c.fillStyle=Y; c.textBaseline='middle'; c.fillText(s,x+u*4,y+h/2+u*.5); };
  for(const a of anns){
    if(a.t==='arrow'){ const ang=Math.atan2(a.b.y-a.a.y,a.b.x-a.a.x), hl=u*9; line(a.a,a.b); line(a.b,{x:a.b.x-hl*Math.cos(ang-.45),y:a.b.y-hl*Math.sin(ang-.45)}); line(a.b,{x:a.b.x-hl*Math.cos(ang+.45),y:a.b.y-hl*Math.sin(ang+.45)}); }
    else if(a.t==='ruler'){ const ang=Math.atan2(a.b.y-a.a.y,a.b.x-a.a.x)+Math.PI/2, k=u*4, tick=q=>line({x:q.x-k*Math.cos(ang),y:q.y-k*Math.sin(ang)},{x:q.x+k*Math.cos(ang),y:q.y+k*Math.sin(ang)}); line(a.a,a.b); tick(a.a); tick(a.b);
      const px=Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y); if(ED.scale||a.cm) label(fmtN(Math.round((a.cm||px*ED.scale)))+' cm',(a.a.x+a.b.x)/2,(a.a.y+a.b.y)/2-u*10); }
    else if(a.t==='angle'){ const [p1,v,p2]=a.p; line(v,p1); line(v,p2); const a1=Math.atan2(p1.y-v.y,p1.x-v.x), a2=Math.atan2(p2.y-v.y,p2.x-v.x); let dlt=a2-a1; while(dlt>Math.PI)dlt-=2*Math.PI; while(dlt<-Math.PI)dlt+=2*Math.PI;
      const rad=Math.min(u*22,Math.hypot(p1.x-v.x,p1.y-v.y)*.5,Math.hypot(p2.x-v.x,p2.y-v.y)*.5); c.strokeStyle=Y; c.lineWidth=u*1.2; c.beginPath(); c.arc(v.x,v.y,rad,a1,a2,dlt<0); c.stroke(); const mid=a1+dlt/2; label(Math.round(Math.abs(dlt)*180/Math.PI)+'°',v.x+Math.cos(mid)*(rad+u*14),v.y+Math.sin(mid)*(rad+u*14)); }
    else if(a.t==='text'){ label(a.s,a.a.x,a.a.y); } } }

/* ---- report ---- */
let RPT={full:true}, rptUrls=[];
function inputRows(m,inputs){ const out=[]; const val=(f,ctx)=>{ const v=ctx[f.k]; if(f.show&&!f.show(ctx)) return null;
    if(f.t==='chk') return v?T('Ja','Yes'):null; if(f.t==='num') return (v===''||v===undefined||v===null)?null:fmtN(v)+(f.unit?' '+tr(f.unit):'');
    if(f.t==='text') return v||null; if(String(v)==='0') return null; const o=f.o&&f.o.find(o=>String(o[0])===String(v)); return o?tr(o[1]):null; };
  m.steps.forEach(s=>s.fields.forEach(f=>{ if(f.t==='list'){ (inputs[f.k]||[]).forEach((it,n)=>out.push([tr(f.l)+' '+(n+1),f.item.filter(sf=>sf.t!=='hdr').map(sf=>{ const x=val(sf,it); return x===null?null:tr(sf.l)+': '+x; }).filter(Boolean).join(' · ')])); } else { const x=val(f,inputs); if(x!==null) out.push([tr(f.l),x]); } })); return out; }
const topParts=r=>(r.parts||[]).map(p=>({p,s:p.pen!==undefined?p.pen:(p.max?p.v/p.max:0)})).filter(x=>x.s>0.001).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>tr(x.p.l)).concat((r.parts||[]).length?[]:(r.rows||[]).filter(x=>x.band==='r'||x.band==='o').slice(0,4).map(x=>tr(x.l)));
async function viewReport(id){ const t=getTask(id), ev=taskEvals(id); $('#view').className='wide';
  setBar(T('Rapport','Report'),'#/t/'+id,`<button id="rmode"><span>${RPT.full?T('Volledig','Full'):T('Compact','Compact')}</span></button><button id="rprint">${ico('print')}<span>${T('Afdrukken','Print')}</span></button>`);
  rptUrls.forEach(u=>URL.revokeObjectURL(u)); rptUrls=[]; const url={};
  for(const p of photosOf(id)){ const b=await Store.getBlobs(p); if(b&&b.full){ url[p.id]=URL.createObjectURL(b.full); rptUrls.push(url[p.id]); } else url[p.id]=p.thumb; }
  ev.forEach(e=>e.result=M[e.method].calc(e.inputs));
  const fig=p=>`<figure><img src="${url[p.id]}" alt=""><figcaption>${esc(p.caption)}</figcaption></figure>`;
  const tp=photosOf(id,null), hero=tp[0]||photosOf(id)[0];
  const groups={}; ev.forEach(e=>{ const k=e.method+'|'+(e.label||''); (groups[k]=groups[k]||{m:M[e.method],label:e.label,before:[],after:[]})[e.phase==='after'?'after':'before'].push(e); });
  const cell=list=>list.length?list.map(e=>`<div class="row" style="gap:8px;flex-wrap:wrap"><b>${esc(scoreText(e.result))}</b>${chip(e.result)}</div>`).join(''):'<span class="muted">–</span>';
  const hasAfter=ev.some(e=>e.phase==='after'), cur=currentEvals(id), overall=worst(cur.map(e=>e.result.band));
  const issues=cur.filter(e=>e.result.band&&e.result.band!=='g').map(e=>({e,parts:topParts(e.result)})).filter(x=>x.parts.length);
  const evCard=e=>{ const m=M[e.method], r=e.result, h=railHtml(r), eph=photosOf(id,e.id);
    return `<div class="rcard"><div class="row" style="flex-wrap:wrap;margin-bottom:6px"><h3 class="grow">${esc(tr(m.name))}${e.label?' — '+esc(e.label):''} <span class="tag ${e.phase}">${phaseName(e.phase)}</span></h3><b style="font-size:1.2rem">${esc(scoreText(r))}</b>${chip(r)}</div>${h.gauge}
      <div class="rcols" style="margin-top:10px"><div><table>${inputRows(m,e.inputs).map(([l,v])=>`<tr><td class="muted" style="width:55%">${esc(l)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div><div>${h.more}</div></div>
      ${e.notes?`<p class="note"><b>${T('Toelichting','Notes')}:</b> ${esc(e.notes)}</p>`:''}${eph.length?`<div class="rphotos">${eph.map(fig).join('')}</div>`:''}<p class="ref">${esc(m.ref)}</p></div>`; };
  $('#view').innerHTML=`<article class="report">
    <p class="muted small" style="margin:0">${T('Beoordeling fysieke belasting','Physical workload assessment')}</p><h1>${esc(t.title||T('Naamloze taak','Untitled task'))}</h1>
    <div class="meta">${[[T('Afdeling','Department'),t.dept],[T('Werkplek / lijn','Workstation / line'),t.station],[T('Beoordelaar','Assessor'),t.assessor],[T('Datum','Date'),fmtD(t.date)],[T('Aantal medewerkers','Number of workers'),t.exposed],[T('Uren per dag','Hours per day'),t.hours]].map(([l,v])=>`<div><span>${l}</span>${esc(v||'–')}</div>`).join('')}</div>
    <div class="${hero?'rhero':''}"><div>${t.desc?`<p style="margin-top:0;white-space:pre-wrap">${esc(t.desc)}</p>`:''}
      <h2 style="margin-top:${t.desc?'14px':'0'}">${T('Samenvatting','Summary')}</h2>
      ${ev.length?`<p style="margin:0 0 8px">${T('Eindoordeel huidige situatie','Overall verdict, current state')}: ${chip({band:overall,levels:4})}</p><table><tr><th>${T('Methode','Method')}</th><th>${phaseName('before')}</th>${hasAfter?`<th>${phaseName('after')}</th>`:''}</tr>${Object.values(groups).map(g=>`<tr><td><b>${esc(tr(g.m.short))}</b>${g.label?'<br><span class="muted">'+esc(g.label)+'</span>':''}</td><td>${cell(g.before)}</td>${hasAfter?`<td>${cell(g.after)}</td>`:''}</tr>`).join('')}</table>`:`<p class="muted">${T('Nog geen beoordelingen.','No assessments yet.')}</p>`}
      </div>${hero?`<figure style="margin:0"><img src="${url[hero.id]}" alt=""><figcaption class="small muted">${esc(hero.caption)}</figcaption></figure>`:''}</div>
    ${issues.length?`<h2>${T('Belangrijkste knelpunten','Main contributing factors')}</h2><table>${issues.map(x=>`<tr><td style="width:30%"><b>${esc(tr(x.e.method&&M[x.e.method].short))}</b></td><td>${esc(x.parts.join(', '))}</td></tr>`).join('')}</table>`:''}
    ${t.triage&&t.triage.health?`<p class="note"><b>${T('Let op','Note')}:</b> ${T('er zijn gezondheidsklachten gemeld die met het werk te maken kunnen hebben.','health complaints that may be work-related have been reported.')}</p>`:''}
    ${t.focus&&Object.values(t.focus).some(Boolean)?`<h2>${T('Bespreking met de medewerkers','Discussion with the workers')}</h2><table>${[['tijd',T('Tijd','Time')],['intens',T('Intensiteit','Intensity')],['houding',T('Houding','Posture')],['omst',T('Omstandigheden','Conditions')]].filter(([k])=>t.focus[k]).map(([k,l])=>`<tr><td style="width:25%"><b>${l}</b></td><td style="white-space:pre-wrap">${esc(t.focus[k])}</td></tr>`).join('')}</table>`:''}
    <h2>${T('Maatregelen','Measures')}</h2>${t.measures.length?`<table><tr><th>${T('Maatregel','Measure')}</th><th>${T('Niveau','Level')}</th><th>${T('Eigenaar','Owner')}</th><th>${T('Gereed voor','Due')}</th><th>${T('Status','Status')}</th></tr>${[...t.measures].sort((a,b)=>a.level.localeCompare(b.level)).map(m=>`<tr><td>${esc(m.text)}</td><td>${esc(m.level+'. '+tr((STRAT.find(s=>s[0]===m.level)||STRAT[0])[1]))}</td><td>${esc(m.owner)}</td><td>${esc(fmtD(m.due))}</td><td>${m.done?T('Gereed','Done'):T('Open','Open')}</td></tr>`).join('')}</table>`:`<p class="muted">${T('Geen maatregelen vastgelegd.','No measures recorded.')}</p>`}
    ${RPT.full&&ev.length?`<h2 class="pagebreak">${T('Beoordelingen in detail','Assessments in detail')}</h2>${ev.map(evCard).join('')}`:''}
    ${tp.length>(hero&&!hero.evalId?1:0)?`<h2>${T('Foto\'s','Photos')}</h2><div class="rphotos">${tp.filter(p=>p!==hero).map(fig).join('')}</div>`:''}
    <div class="sign"><div>${T('Beoordelaar','Assessor')}${t.assessor?': '+esc(t.assessor):''}</div><div>${T('Leidinggevende / akkoord','Manager / approval')}</div></div>
    <p class="ref">${T('Opgesteld met','Prepared with')} ErgoFlow ${VERSION}. ${T('De methoden geven een risico-inschatting op taakniveau; bij klachten of meerdere zware taken per dag een deskundige raadplegen.','The methods give a task-level risk estimate; with complaints or several heavy tasks per day, consult an expert.')}</p></article>`;
  $('#rmode').onclick=()=>{ RPT.full=!RPT.full; viewReport(id); };
  $('#rprint').onclick=async()=>{ await Promise.all($$('.report img').map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;}))); window.print(); }; }

/* ---- export / import ---- */
const blobToData=b=>new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
const dataToBlob=async d=>(await fetch(d)).blob();
async function exportJSON(taskId){ const tasks=taskId?[getTask(taskId)]:S.tasks, ids=new Set(tasks.map(t=>t.id)), photos=[];
  for(const p of S.photos.filter(p=>ids.has(p.taskId))){ const b=await Store.getBlobs(p); photos.push(Object.assign({},p,{full:b?await blobToData(b.full):null,base:b&&b.base&&b.base!==b.full?await blobToData(b.base):null})); }
  const data={app:'ergoflow',format:1,version:VERSION,exported:new Date().toISOString(),tasks,evals:S.evals.filter(e=>ids.has(e.taskId)).map(e=>Object.assign({},e,{result:undefined})),photos};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download='ergoflow-'+(taskId?(tasks[0].title||'taak').replace(/[^\w-]+/g,'_').slice(0,40):'export')+'-'+today()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
$('#imp').onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(d.app!=='ergoflow') throw 0;
    for(const t of d.tasks||[]) await Store.put('tasks',t); for(const e of d.evals||[]) await Store.put('evals',e);
    for(const p of d.photos||[]){ const {full,base,...meta}=p; if(typeof full==='string'){ const fb=await dataToBlob(full); await Store.putBlobs(meta,{full:fb,base:typeof base==='string'?await dataToBlob(base):fb}); } await Store.put('photos',meta); }
    await loadAll(); closeSheet(); route(); alert(T('Import gereed: ','Import complete: ')+(d.tasks||[]).length+' '+T('taken','tasks')); }
  catch(e){ alert(T('Dit is geen geldig ErgoFlow-bestand.','This is not a valid ErgoFlow file.')); } ev.target.value=''; };

/* ---- boot ---- */
async function loadAll(){ [S.tasks,S.evals,S.photos]=await Promise.all([Store.all('tasks'),Store.all('evals'),Store.all('photos')]);
  S.evals=S.evals.filter(e=>M[e.method]); S.evals.forEach(e=>{ try{ normalizeInputs(e); e.result=M[e.method].calc(e.inputs); }catch(err){ e.result={band:null,score:null}; } }); S.tasks.forEach(t=>{ t.triage=t.triage||{}; t.measures=t.measures||[]; }); }
(async()=>{ document.documentElement.lang=LANG; setBar('ErgoFlow',null); $('#view').innerHTML=`<div class="empty">${T('Laden…','Loading…')}</div>`; try{ await Store.open(); await loadAll(); }catch(e){ $('#view').innerHTML=`<div class="empty">${T('Opslag is niet beschikbaar in deze browser (privémodus?).','Storage is not available in this browser (private mode?).')}</div>`; return; } route(); })();
</script>
