const MAN={
niosh:{
  use:["Voor tillen en neerzetten met twee handen, staand, in een vloeiende beweging. Niet voor tillen in zit of geknield, dragen over meer dan een paar stappen, duwen of trekken, of lasten die instabiel zijn (vloeistof, personen).","For lifting and lowering with two hands, standing, in a smooth movement. Not for lifting while seated or kneeling, carrying more than a few steps, pushing or pulling, or unstable loads (liquids, people)."],
  prep:[["Neem mee: rolmaat, weegschaal (of productgewicht van het etiket) en een teller of stopwatch.","Bring: tape measure, scale (or the product weight from the label) and a counter or stopwatch."],
    ["Meet bij de medewerker zoals die werkelijk werkt, niet zoals het hoort. Meet bij een paar mensen en neem het gemiddelde.","Measure the worker as they really work, not as it should be done. Measure a few people and take the average."]],
  steps:[
   [["Duur: tel alle tijd waarin getild wordt op één dag. Kies ≤ 1 uur alleen als er na het tillen minstens 1,2× zo lang licht werk volgt; ≤ 2 uur als dat minstens 0,3× zo lang is. Twijfel je, kies ≤ 8 uur.","Duration: add up all time spent lifting in a day. Choose ≤ 1 h only if lifting is followed by light work for at least 1.2× as long; ≤ 2 h if at least 0.3× as long. When in doubt, choose ≤ 8 h."],
    ["Referentiegewicht: laat op 23 kg staan, tenzij je bedrijf een andere afspraak heeft. 23 kg beschermt de meeste mannen en ongeveer driekwart van de vrouwen.","Reference mass: leave at 23 kg unless your company has agreed otherwise. 23 kg protects most men and about three quarters of women."],
    ["Eenhandig of met twee personen: alleen aanvinken als dat de normale werkwijze is. Bij twee personen vul je straks het gewicht per persoon in (de helft).","One-handed or two persons: tick only if that is the normal way of working. With two persons, enter the weight per person later (half)."]],
   [["Maak voor elke duidelijk andere tilsituatie een eigen tilhandeling, bv. onderste laag en bovenste laag van een pallet. Elke handeling krijgt zijn eigen frequentie. De app rekent dan de gecombineerde index (CLI) uit.","Create a separate lift for every clearly different situation, e.g. bottom layer and top layer of a pallet. Each lift gets its own frequency. The app then calculates the composite index (CLI)."],
    ["Gewicht: weeg de last. Wisselt het gewicht, neem dan het zwaarste dat regelmatig voorkomt.","Weight: weigh the load. If it varies, take the heaviest that occurs regularly."],
    ["Frequentie: tel 15 minuten lang het aantal keer tillen en deel door 15. Tel alleen de periode waarin echt getild wordt.","Frequency: count the lifts for 15 minutes and divide by 15. Count only the period in which lifting really takes place."],
    ["Horizontale afstand (H): van het midden tussen de enkels tot het midden van de handen, gemeten over de vloer, op het moment van oppakken. Niet vanaf de tenen en niet tot de rand van de doos. Minder dan 25 cm telt als 25; boven 63 cm is de tilsituatie niet aanvaardbaar.","Horizontal distance (H): from the midpoint between the ankles to the midpoint of the hands, measured along the floor, at the moment of pick-up. Not from the toes and not to the edge of the box. Less than 25 cm counts as 25; above 63 cm the lift is not acceptable."],
    ["Handhoogte (V): van de vloer tot het midden van de handen. Meet bij oppakken en bij neerzetten. 75 cm (heuphoogte) is ideaal.","Hand height (V): from the floor to the middle of the hands. Measure at pick-up and at set-down. 75 cm (hip height) is ideal."],
    ["Draaihoek: hoeveel graden de last naast het lichaam wordt gepakt of neergezet. Recht voor het lichaam = 0°, recht opzij = 90°. Als de medewerker zijn voeten meedraait is er geen draaiing.","Asymmetry angle: how many degrees to the side of the body the load is picked up or set down. Straight in front = 0°, straight to the side = 90°. If the worker moves the feet along, there is no twisting."],
    ["Grip: Goed = handvatten of uitsparingen, of een compact voorwerp dat je goed omvat. Redelijk = geen handvatten, maar vingers kunnen er haaks onder. Slecht = groot, glad, slap (zakken), scherpe randen of met handschoenen moeilijk vast te houden.","Coupling: Good = handles or cut-outs, or a compact object you can wrap your hands around. Fair = no handles, but fingers fit under at a right angle. Poor = bulky, slippery, sagging (bags), sharp edges or hard to hold with gloves."],
    ["Nauwkeurig plaatsen: aanvinken als de last bij het neerzetten precies moet worden gepositioneerd of even vastgehouden (strak stapelen, in een rek schuiven). Meet dan ook H en de draaihoek bij het neerzetten.","Significant control: tick if the load must be positioned precisely or held for a moment at set-down (tight stacking, sliding into a rack). Then also measure H and the angle at set-down."]]],
  read:[["LI = gewicht ÷ aanbevolen gewichtsgrens (RWL). Tot 1 laag risico, 1–2 verhoogd, boven 2 hoog.","LI = weight ÷ recommended weight limit (RWL). Up to 1 low risk, 1–2 increased, above 2 high."],
    ["De balken tonen hoeveel elke factor de gewichtsgrens verlaagt. De langste balk is je beste aangrijpingspunt: last dichter bij het lichaam, pakken op heuphoogte, minder vaak, niet draaien.","The bars show how much each factor lowers the weight limit. The longest bar is your best lever: load closer to the body, pick up at hip height, less often, no twisting."],
    ["Staat er ∞, dan valt een maat buiten de grenzen van de formule (bv. H boven 63 cm of te hoge frequentie): de situatie is niet aanvaardbaar.","If you see ∞, a measurement is outside the limits of the equation (e.g. H above 63 cm or frequency too high): the situation is not acceptable."]],
  err:[["H meten vanaf de tenen of tot de voorkant van de doos in plaats van tot de handen.","Measuring H from the toes or to the front of the box instead of to the hands."],
    ["De frequentie middelen over de hele werkdag in plaats van over de periode waarin getild wordt.","Averaging frequency over the whole working day instead of over the period of lifting."],
    ["Alleen de gemakkelijke laag van de pallet meten. De onderste en bovenste laag bepalen het risico.","Measuring only the easy layer of the pallet. The bottom and top layers determine the risk."]],
  fig:'niosh'},
kimlhc:{
  use:["Voor tillen, vasthouden en dragen van lasten van 3 kg of meer. Sneller dan NIOSH en ook bruikbaar als er gedragen wordt of als je niet precies kunt meten. Niet voor lasten op een kar (KIM-PP) of dragen over meer dan 10 m (dan ook KIM-BM).","For lifting, holding and carrying loads of 3 kg or more. Quicker than NIOSH and also usable when loads are carried or you cannot measure precisely. Not for loads on a cart (KIM-PP) or carrying over more than 10 m (then also KIM-BM)."],
  prep:KIM_GEN.concat([["Neem mee: weegschaal en teller.","Bring: scale and counter."]]),
  steps:[
   [["Aantal handelingen: elke keer oppakken, vasthouden of dragen telt als één. Tel een kwartier en reken om naar de hele dag voor deze deeltaak.","Number of operations: every pick-up, hold or carry counts as one. Count for a quarter of an hour and convert to the whole day for this sub-activity."],
    ["Uitgevoerd door: kies Vrouwen als (ook) vrouwen dit werk doen. Dan is iedereen beschermd.","Performed by: choose Women if women (also) do this work. Then everyone is protected."],
    ["Effectief gewicht: wat de medewerker werkelijk draagt. Kantelen van een doos of vat is ongeveer de helft van het gewicht; met twee personen tillen ongeveer 60 % per persoon.","Effective weight: what the worker really carries. Tilting a box or drum is about half the weight; lifting with two persons is about 60 % per person."],
    ["Hanteren: let op of beide handen gelijk belast worden. Een last die in één hand hangt of scheef gedragen wordt is asymmetrisch.","Handling: check whether both hands are loaded equally. A load hanging in one hand or carried lopsided is asymmetrical."]],
   [["Kies de houding bij oppakken en bij neerzetten. Rechtop = rug recht, last dicht bij het lichaam tussen heup en borst. Licht gebogen = romp iets voorover, last iets van het lichaam af, handen tot schouderhoogte of half door de knieën. Diep gebogen = ver voorover, handen onder kniehoogte. Gehurkt / geknield.","Choose the posture at pick-up and at set-down. Upright = straight back, load close to the body between hip and chest. Slightly bent = trunk a little forward, load somewhat away from the body, hands up to shoulder height or half squat. Deep bend = far forward, hands below knee height. Squatting / kneeling."],
    SOMS,
    ["Ver van het lichaam = de handen zijn duidelijk meer dan een onderarmlengte van de romp af.","Far from the body = the hands are clearly more than a forearm length away from the trunk."]],
   [["Grip: Beperkt = geen handvatten, meer knijpkracht nodig. Sterk gehinderd = glad, zacht, scherp of nauwelijks vast te pakken.","Grip: Restricted = no handles, more grip force needed. Considerably hindered = slippery, soft, sharp or hardly possible to grip."],
    ["Ruimte en ondergrond: Beperkt = minder dan 1,5 m² werkruimte, licht ongelijke of vuile vloer. Ongunstig = te laag of erg krap, gladde of erg ongelijke vloer, treden, helling van 5–10°.","Space and floor: Restricted = less than 1.5 m² work area, slightly uneven or dirty floor. Unfavourable = too low or very confined, slippery or very uneven floor, steps, 5–10° inclination."],
    ["Vasthouden / dragen: kijk hoe lang de last in de handen blijft en hoe ver ermee gelopen wordt.","Holding / carrying: look at how long the load stays in the hands and how far it is carried."],
    KIM_ORG]],
  read:KIM_READ,
  err:[["Het hele productgewicht invullen terwijl de last alleen gekanteld of met twee personen getild wordt.","Entering the full product weight while the load is only tilted or lifted by two persons."],
    ["De houding beoordelen op het gemakkelijkste moment. Kijk naar oppakken van de onderste laag en neerzetten op de bovenste.","Assessing posture at the easiest moment. Look at picking up from the bottom layer and setting down on the top one."]]},
kimpp:{
  use:["Voor het met spierkracht verplaatsen van karren, rolcontainers, palletwagens, kruiwagens, hangbanen en kranen. Geeft zelf een score, zonder krachtmeting. Niet voor het slepen of rollen van lasten zonder hulpmiddel (KIM-BF).","For moving carts, roll containers, pallet trucks, wheelbarrows, overhead conveyors and cranes by muscle power. Gives a score of its own, without force measurement. Not for dragging or rolling loads without a device (KIM-BF)."],
  prep:KIM_GEN.concat([["Zoek het leeggewicht van de kar op (typeplaatje of leverancier) en tel het gewicht van de lading erbij. Loop de route één keer mee en let op vloer, drempels, hellingen en bochten.","Look up the empty weight of the cart (nameplate or supplier) and add the weight of the load. Walk the route once and watch the floor, sills, slopes and bends."]]),
  steps:[
   [["Tijdsmaat: kies Afstand voor transport over een route (afstand per rit × aantal ritten per dag). Kies Duur als er vooral kort gemanoeuvreerd wordt; tel dan de minuten dat er echt geduwd of getrokken wordt.","Time basis: choose Distance for transport along a route (distance per trip × trips per day). Choose Duration if it is mainly short manoeuvring; then add up the minutes of actual pushing or pulling."],
    ["Transportmiddel: het soort wielen bepaalt de keuze. Alleen zwenkwielen (rolcontainer) stuurt zwaarder dan een kar met twee vaste wielen.","Transport device: the kind of wheels decides. Swivel castors only (roll container) steers harder than a cart with two fixed wheels."],
    ["Gewicht: kar plus lading. Neem het gewicht dat het meest voorkomt; beoordeel de zwaarste kar zo nodig apart.","Weight: cart plus load. Take the weight that occurs most; assess the heaviest cart separately if needed."],
    ["Met twee personen: alleen aanvinken als de kar altijd samen in beweging wordt gebracht en verplaatst.","In pairs: tick only if the cart is always started and moved together."]],
   [["Ondergrond: kies het slechtste stuk dat op elke rit voorkomt, niet het beste.","Driveway: choose the worst stretch that occurs on every trip, not the best."],
    ["Helling: 2° is ongeveer 4 cm stijging per meter, 5° ongeveer 9 cm per meter. Meet met een waterpas-app of lengte en hoogte van de helling.","Inclination: 2° is about 4 cm rise per metre, 5° about 9 cm per metre. Measure with a level app or the length and height of the slope."]],
   [["Vink alleen aan wat regelmatig voorkomt. Probeer de kar zelf: komt hij zwaar op gang, trekt hij scheef, lopen de wielen stroef?","Tick only what occurs regularly. Try the cart yourself: is it hard to start, does it pull to one side, are the wheels stiff?"],
    ["De punten voor omstandigheden en voor eigenschappen van het middel tellen elk tot maximaal 4.","The points for conditions and for device properties each count up to a maximum of 4."]],
   [["Houding: let op de duwhoogte. Goed is tussen 0,9 en 1,2 m of vrij te kiezen. Eenzijdig trekken met de arm naar achteren en geen zicht over de lading zijn ongunstig.","Posture: look at the push height. Good is between 0.9 and 1.2 m or freely selectable. Pulling on one side with the arm backwards and no view over the load are unfavourable."],

  err:[["Alleen het gewicht van de lading invullen en de kar vergeten.","Entering only the weight of the load and forgetting the cart."],
    ["De route beoordelen op een rustig moment: obstakels, natte vloer en volle gangpaden tellen mee.","Assessing the route at a quiet moment: obstacles, wet floor and full aisles count."]]},
kimmho:{
  use:["Voor repeterend werk met handen en armen op een vaste plek: sorteren, inpakken, snijden, monteren, controleren. Niet voor krachten met het hele lichaam (KIM-BF) of lasten van 3 kg of meer verplaatsen (KIM-LHC).","For repetitive work with hands and arms at a fixed place: sorting, packing, cutting, assembling, inspecting. Not for whole-body forces (KIM-BF) or moving loads of 3 kg or more (KIM-LHC)."],
  prep:KIM_GEN.concat([["Film één minuut van het werk met je telefoon. Terugkijken (vertraagd) maakt tellen van bewegingen veel makkelijker. Beoordeel de hand die het meeste doet.","Film one minute of the work with your phone. Replaying it (slowed down) makes counting movements much easier. Assess the hand that does the most."]]),
  steps:[
   [["Duur: alleen de uren dat deze taak echt wordt uitgevoerd, zonder pauzes en ander werk.","Duration: only the hours this task is really carried out, without breaks and other work."],
    ["Vasthouden: de hand houdt iets minstens 4 seconden stil vast (product, mes, gereedschap). Schat hoeveel seconden per minuut dat is.","Holding: the hand holds something still for at least 4 seconds (product, knife, tool). Estimate how many seconds per minute that is."],
    ["Bewegen: tel het aantal keer per minuut dat de hand pakt, drukt, knijpt of snijdt.","Moving: count the number of times per minute the hand grips, presses, squeezes or cuts."],
    ["Krachtniveau, probeer het zelf: Laag = knop indrukken, licht product geleiden. Matig = kleine delen pakken en in elkaar zetten. Hoog = draaien, wikkelen, stevig knijpen, snijden, klein handgereedschap. Zeer hoog = snijden met veel kracht, nietpistool. Piekkracht = bouten los- of vastdraaien, inpersen, slaan.","Force level, try it yourself: Low = pressing a button, guiding a light product. Moderate = gripping and joining small parts. High = turning, winding, firm squeezing, cutting, small hand tools. Very high = cutting with much force, staple gun. Peak = tightening or loosening bolts, pressing in, hitting."],
    ["Extra krachtpunten: laat op 0 als er één duidelijke hoofdkracht is.","Extra force points: leave at 0 if there is one clear main force."]],
   [["Hand-/armstand: kijk naar pols en elleboog. Eindstand = de pols is ver gebogen of gedraaid, de arm ver gestrekt of geheven.","Hand/arm position: look at the wrist and elbow. At the limit = the wrist is bent or rotated far, the arm stretched or raised far."],
    ["Lichaamshouding: kies de regel die het beste past; bij twijfel de hogere.","Body posture: choose the line that fits best; when in doubt the higher one."],

  read:KIM_READ,
  err:[["Snelle bewegingen onderschatten: tel ze van een filmpje, niet op het oog.","Underestimating fast movements: count them from a video, not by eye."],
    ["De hele dienst als taakduur invullen terwijl er ook ander werk gedaan wordt.","Entering the whole shift as task duration while other work is also done."]]},
kimbf:{
  use:["Voor werk waarbij het hele lichaam kracht zet: scheppen, zwaar handgereedschap, hendels en afsluiters, lasten over rollenbanen schuiven, slepen, vaten kantelen. Gaat het alleen om vinger- en handkracht, gebruik dan KIM-MHO.","For work where the whole body exerts force: shovelling, heavy hand tools, levers and valves, sliding loads over roller tracks, dragging, tipping drums. If only finger and hand force is involved, use KIM-MHO."],
  prep:KIM_GEN,
  steps:[
   [["Duur of aantal: doorlopend werk (scheppen, schoonspuiten) = totaal aantal minuten per dag. Korte zware handelingen van minder dan een minuut (vat kantelen, afsluiter opendraaien) = aantal keer per dag.","Duration or number: continuous work (shovelling, pressure cleaning) = total minutes per day. Short heavy actions of less than a minute (tipping a drum, opening a valve) = number of times per day."],
    ["Krachtniveau: Matig = haakse slijper, lasten tot 20 kg over een rollenbaan. Hoog = zwaar gereedschap 3–8 kg, hogedrukreiniger, scheppen tot 4 kg, 20–50 kg over rollenbaan. Zeer hoog = sloophamer, scheppen 4–8 kg, 50–100 kg over rollenbaan. Piekkracht = koevoet, voorhamer, vat van meer dan 200 kg kantelen.","Force level: Moderate = angle grinder, loads up to 20 kg on a roller track. High = heavy tools 3–8 kg, pressure washer, shovelling up to 4 kg, 20–50 kg on roller track. Very high = pneumatic hammer, shovelling 4–8 kg, 50–100 kg on roller track. Peak = crowbar, sledgehammer, tipping a drum over 200 kg."],
    ["Vasthouden = kracht minstens 4 seconden stil volhouden. Bewegen = aantal krachtuitoefeningen. Bij doorlopend werk per minuut, bij korte handelingen per handeling.","Holding = keeping up force for at least 4 seconds. Moving = number of force exertions. For continuous work per minute, for short actions per action."],
    ["Bij Vrouwen telt de kracht automatisch 1,5× zo zwaar.","For Women the force automatically counts 1.5× as heavy."]],
   [["Houding: kijk naar de romp tijdens het kracht zetten, niet ervoor of erna.","Posture: look at the trunk while the force is exerted, not before or after."],
    SOMS, KIM_ORG]],
  read:KIM_READ,
  err:[["Een piekkracht als matig inschatten omdat het maar kort duurt. Juist korte, zeer zware handelingen geven het risico.","Rating a peak force as moderate because it is short. Short, very heavy actions are exactly what causes the risk."]]},
kimabp:{
  use:["Voor werk in een ongunstige of lang volgehouden houding met weinig kracht: gebogen aan een band staan, boven het hoofd werken, knielen, de hele dag staan of zitten. Geeft drie scores: rug, schouders, knieën. De hoogste telt.","For work in an awkward or long-held posture with little force: standing bent over a belt, working overhead, kneeling, standing or sitting all day. Gives three scores: back, shoulders, knees. The highest counts."],
  prep:KIM_GEN.concat([["Eenvoudige meting: kijk 10 minuten lang elke 30 seconden in welke houding de medewerker staat en turf dat. Het aandeel turfjes is het aandeel van de tijd.","Simple measurement: for 10 minutes, note every 30 seconds which posture the worker is in. The share of tallies is the share of the time."]]),
  steps:[
   [["Duur: de uren per dag dat deze taak wordt uitgevoerd.","Duration: the hours per day this task is carried out."]],
   [["Een houding telt alleen mee als die minstens 1 minuut achter elkaar wordt volgehouden, of steeds terugkomt voor 10 seconden of langer.","A posture only counts if it is held for at least 1 minute at a time, or keeps returning for 10 seconds or longer."],
    ["Kies per regel welk deel van de taaktijd de houding voorkomt. Meerdere regels mogen tegelijk ingevuld zijn, maar samen niet meer dan de hele tijd. 20° voorover is net zichtbaar gebogen, 60° is ver voorover (handen rond kniehoogte).","Choose per line what share of the task time the posture occurs. Several lines may be filled in, but together not more than the whole time. 20° forward is just visibly bent, 60° is far forward (hands around knee height)."]],
   [["Armen geheven telt alleen als de arm niet ondersteund is. Boven schouderhoogte = de handen komen boven de schouders.","Arms raised only counts if the arm is not supported. Above shoulder level = the hands come above the shoulders."]],
   [["Voortdurend staan = op één plek staan, ook als er af en toe een paar stappen gezet worden.","Constant standing = standing in one place, even if a few steps are taken now and then."]],
   [["Deze punten tellen alleen mee voor een lichaamsregio waar je hierboven een houding hebt ingevuld.","These points only count for a body region where you filled in a posture above."], SOMS]],
  read:KIM_READ.concat([["Een hoge score in één regio wordt niet goedgemaakt door een lage in een andere.","A high score in one region is not compensated by a low one in another."]]),
  err:[["Houdingen van een paar seconden meetellen. Daarvoor is deze methode niet bedoeld.","Counting postures of a few seconds. This method is not meant for those."]]},
kimbm:{
  use:["Voor werk met veel lopen, klimmen, traplopen, ladders of kruipen, met of zonder last; of fietsen en steppen voor het werk. Voor dragen over korte afstand gebruik je KIM-LHC.","For work with much walking, climbing, stairs, ladders or crawling, with or without load; or cycling for work. For carrying over a short distance use KIM-LHC."],
  prep:KIM_GEN.concat([["Een stappenteller of de loopafstand op de plattegrond helpt om de looptijd te schatten: 100 m normaal lopen is ongeveer 1,5 minuut.","A step counter or the walking distance on the floor plan helps to estimate walking time: 100 m of normal walking is about 1.5 minutes."]]),
  steps:[
   [["Duur: alleen de minuten per dag dat er echt gelopen, geklommen of gereden wordt.","Duration: only the minutes per day of actual walking, climbing or riding."],
    ["Type beweging: kies het zwaarste type dat regelmatig voorkomt. Beoordeel traplopen en vlak lopen zo nodig apart.","Type of movement: choose the heaviest type that occurs regularly. Assess stairs and level walking separately if needed."],
    ["Gedragen last: het gewicht dat tijdens het lopen wordt gedragen, inclusief gereedschap en rugzak.","Carried load: the weight carried while moving, including tools and backpack."],
    SOMS, KIM_ORG]],
  read:KIM_READ,
  err:[["De hele dienst als duur invullen. Tel alleen de tijd in beweging.","Entering the whole shift as duration. Count only the time in motion."]]},
harm:{
  use:["Voor taken waarbij vooral handen en armen werken, meer dan 1 uur per dag, met krachten tot 6 kg per hand: sorteren, inpakken, snijden, schoonmaken, monteren. Niet voor beeldschermwerk en niet voor tillen van zwaardere lasten.","For tasks where mainly hands and arms work, more than 1 hour per day, with forces up to 6 kg per hand: sorting, packing, cutting, cleaning, assembling. Not for screen work and not for lifting heavier loads."],
  prep:[["Film een paar minuten van het werk. Beoordeel de meest actieve hand; bij klachten de kant met klachten. Zijn beide handen even actief maar op een andere manier, maak dan twee beoordelingen (gebruik het veld Kenmerk).","Film a few minutes of the work. Assess the most active hand; with complaints the side with complaints. If both hands are equally active but in a different way, make two assessments (use the Label field)."],
    ["De foto's met grenshoudingen staan in de TNO-handleiding HARM 2.0 op fysiekebelasting.tno.nl.","The photos with boundary postures are in the TNO HARM 2.0 manual at fysiekebelasting.tno.nl."]],
  steps:[
   [["Duur: alle perioden van deze taak op één dag bij elkaar, alleen voor dagen waarop de taak voorkomt. Taken die sterk op elkaar lijken tel je samen. Voorbeeld: 2 dagen 2 uur en 2 dagen 4 uur = gemiddeld 3 uur.","Duration: all periods of this task in one day added up, only for days on which the task occurs. Add up tasks that are very similar. Example: 2 days 2 hours and 2 days 4 hours = 3 hours on average."],
    ["Pauze: aanvinken als er na hooguit 1,5 uur minstens 7,5 minuut pauze is (of 15 minuten na 3 uur) waarin de handen en armen echt rust krijgen.","Break: tick if after at most 1.5 hours there is a break of at least 7.5 minutes (or 15 minutes after 3 hours) in which hands and arms really rest."]],
   [["Vul alleen de krachten in die voorkomen. Krachten die op elkaar lijken beoordeel je als één kracht.","Fill in only the forces that occur. Assess forces that are alike as one force."],
    ["Klein (tot 1 kg): pincet, sorteren, licht product vasthouden. Groot (1–6 kg): mes of tang gebruiken, stevig vastpakken, zware hendel. Piek: slaan met hand, vuist of hamer.","Small (up to 1 kg): tweezers, sorting, holding a light product. Large (1–6 kg): using a knife or pliers, firm gripping, heavy lever. Peak: hitting with hand, fist or hammer."],
    ["Duur = hoeveel seconden per minuut de kracht wordt volgehouden. Frequentie = hoe vaak per minuut de kracht wordt gezet. De app neemt de hoogste score.","Duration = how many seconds per minute the force is sustained. Frequency = how often per minute the force is exerted. The app takes the highest score."],
    ["Komen er krachten boven 6 kg voor, beoordeel die dan met een tilmethode of KIM-BF.","If forces above 6 kg occur, assess them with a lifting method or KIM-BF."]],
   [["Schat per houding welk deel van de taaktijd die voorkomt: minder dan 10 %, 10–50 % of meer dan de helft. Alleen duidelijk zichtbare afwijkingen van een ontspannen houding tellen.","Estimate per posture what share of the task time it occurs: less than 10 %, 10–50 % or more than half. Only clearly visible deviations from a relaxed posture count."],
    ["Bovenarm geheven telt niet als de arm ondersteund wordt (armsteun, tafel).","Upper arm raised does not count if the arm is supported (armrest, table)."]],
   [["Kijk naar pols en onderarm van de meest actieve hand. Een filmpje van dichtbij helpt.","Look at the wrist and forearm of the most active hand. A close-up video helps."]],
   [["Trillingen: is de trillingswaarde van het gereedschap bekend (handleiding, leverancier), kies dan op de waarde in m/s². Anders op wat je ziet en voelt.","Vibration: if the vibration value of the tool is known (manual, supplier), choose by the value in m/s². Otherwise by what you see and feel."],
    ["Andere factoren: elke aangevinkte factor telt 0,5 punt.","Other factors: every ticked factor counts 0.5 point."]]],
  read:[["Score = taakduurscore × som van kracht, houdingen, trillingen en andere factoren. Onder 30 groen, 30–50 oranje, 50 of meer rood.","Score = task duration score × sum of force, postures, vibration and other factors. Below 30 green, 30–50 orange, 50 or more red."],
    ["Omdat de duur als vermenigvuldiger werkt, helpt taakroulatie naar ander soort werk direct. De balken laten zien welke factor je daarnaast het beste kunt aanpakken.","Because duration works as a multiplier, rotating to a different kind of work helps directly. The bars show which factor is best to tackle besides."]],
  err:[["Taakroulatie meetellen als afwisseling terwijl de andere taak dezelfde hand-armbelasting geeft.","Counting job rotation as variation while the other task gives the same hand-arm load."],
    ["De minst actieve hand beoordelen.","Assessing the less active hand."]]},
whi:{
  use:["Voor taken van meer dan 30 minuten per dag waarin ongunstige houdingen voorkomen en weinig kracht nodig is (minder dan 1 kg). Geeft per houding groen, oranje of rood. Niet voor beeldschermwerk.","For tasks of more than 30 minutes per day with awkward postures and little force (less than 1 kg). Gives green, orange or red per posture. Not for screen work."],
  prep:[["Komt een houding vaak en kort voor? Tel dan een paar keer hoe vaak per minuut en hoe lang per keer. Totale duur per dag (min) = keer per minuut × seconden per keer × taakduur in minuten ÷ 60.","Does a posture occur often and briefly? Then count a few times how often per minute and how long each time. Total duration per day (min) = times per minute × seconds per time × task duration in minutes ÷ 60."],
    ["Kijk bij meerdere medewerkers en op meerdere momenten; neem het gemiddelde.","Observe several workers at several moments; take the average."]],
  steps:[
   [["Aaneengesloten = hoe lang de houding achter elkaar wordt volgehouden zonder onderbreking. Totaal = alle perioden op een dag bij elkaar. De slechtste van de twee bepaalt de kleur.","Continuous = how long the posture is held in one go without interruption. Total = all periods in a day added up. The worse of the two decides the colour."],
    ["Plaatsgebonden staan = staan binnen een straal van ongeveer 2 meter.","Static standing = standing within a radius of about 2 metres."]],
   [["Rompbuiging telt vanaf ongeveer 30° voorover: duidelijk zichtbaar gebogen. Rompdraaiing = de schouders staan gedraaid ten opzichte van de heupen.","Trunk flexion counts from about 30° forward: clearly visibly bent. Trunk rotation = the shoulders are turned relative to the hips."],
    ["Vink aan als de houding vaak langer dan 1 minuut wordt volgehouden, of vaker dan 2 keer per minuut terugkomt. In de middelste duurcategorie wordt de uitkomst dan rood.","Tick if the posture is often held longer than 1 minute, or returns more than 2 times per minute. In the middle duration category the result then turns red."]],
   [["Nekbuiging telt vanaf ongeveer 20°: de blik is duidelijk omlaag of omhoog gericht. Bovenarm geheven telt vanaf 30° en alleen zonder ondersteuning.","Neck flexion counts from about 20°: the gaze is clearly directed down or up. Upper arm raised counts from 30° and only without support."]],
   [["Pols: duidelijk gebogen, gestrekt of zijwaarts geknikt, of de onderarm sterk gedraaid. Let op de vinkjes: meer dan 15 keer per minuut of langer dan 1 minuut volgehouden.","Wrist: clearly flexed, extended or bent sideways, or the forearm strongly rotated. Mind the ticks: more than 15 times per minute or held longer than 1 minute."]]],
  read:[["Elke houding krijgt een eigen kleur; de slechtste bepaalt het eindoordeel. Pak rood eerst aan en kijk bij rood en oranje ook of de taakduur omlaag kan.","Each posture gets its own colour; the worst decides the overall verdict. Tackle red first and for red and orange also check whether task duration can be reduced."],
    ["TNO geeft zelf aan dat de voorspellende waarde van dit instrument nog niet is vastgesteld. Gebruik het als signalering.","TNO itself states that the predictive value of this tool has not yet been established. Use it for screening."]],
  err:[["Alleen de totale duur schatten en vergeten dat lang aaneengesloten knielen of staan ook telt.","Estimating only the total duration and forgetting that long continuous kneeling or standing also counts."]]},
dutch:{
  use:["Voor duwen en trekken van rollend materieel met het hele lichaam: rolcontainers, karren, palletwagens, kuipen. De TNO-tool rekent uit hoe zwaar de kar mag zijn; ErgoFlow legt je gegevens vast, toetst je kargewicht aan die grenzen en beoordeelt wielen, route en gedrag.","For pushing and pulling wheeled equipment with the whole body: roll containers, carts, pallet trucks, tubs. The TNO tool calculates how heavy the cart may be; ErgoFlow records your data, tests your cart weight against those limits and rates wheels, route and behaviour."],
  prep:[["Je hebt een gratis account nodig op fysiekebelasting.tno.nl. Vul eerst stap 1–3 hier in, neem dezelfde waarden over in de TNO-tool en vul daarna stap 4 in.","You need a free account at fysiekebelasting.tno.nl. First complete steps 1–3 here, copy the same values into the TNO tool and then complete step 4."],
    ["Neem mee: rolmaat (wieldiameter, afstand), het leeggewicht van de kar en het gewicht van de lading.","Bring: tape measure (wheel diameter, distance), the empty weight of the cart and the weight of the load."]],
  steps:[
   [["Gemiddeld gewicht = kar plus lading zoals die meestal is. Maximaal = de zwaarste kar die ongeveer één keer per dag voorkomt.","Average weight = cart plus load as it usually is. Maximum = the heaviest cart that occurs about once a day."],
    ["Handhoogte: waar de handen de kar vastpakken, vergeleken met het lichaam.","Hand height: where the hands hold the cart, compared with the body."],
    ["Frequentie: gemiddeld over de hele werkdag. Elke keer dat de kar in beweging wordt gebracht telt.","Frequency: averaged over the whole working day. Every time the cart is set in motion counts."],
    ["2 of meer personen: alleen als de kar altijd samen op gang wordt gebracht.","2 or more persons: only if the cart is always started together."]],
   [["Wieldiameter: meet het wiel, niet de vork. Kleine wielen (onder 13 cm) rollen zwaar, vooral over drempels en ruwe vloeren.","Wheel diameter: measure the wheel, not the fork. Small wheels (under 13 cm) roll heavily, especially over sills and rough floors."],
    ["Ondergrond: kies wat op het grootste deel van de route ligt.","Floor: choose what covers most of the route."]],
   [["Kijk bij het wegrijden: staan de zwenkwielen dwars, dan is de startkracht veel hoger.","Watch the start: if the swivel wheels are turned sideways, the starting force is much higher."]],
   [["In de TNO-uitkomst staat een tabel Grenswaarde. Neem voor gemiddeld en maximaal gewicht over: Groen tot = het streefgewicht; Rood vanaf = de grens waarboven het rood wordt.","The TNO result has a table Grenswaarde. For average and maximum weight copy: Green below = the target weight; Red from = the limit above which it turns red."],
    ["Verander je later iets in stap 1–3, reken de grenzen dan opnieuw uit in de TNO-tool.","If you later change something in steps 1–3, recalculate the limits in the TNO tool."]]],
  read:[["Het oordeel is de slechtste van gemiddeld en maximaal gewicht. De punten eronder zijn verzwarende factoren: bij twee of meer is de werkelijke belasting waarschijnlijk hoger dan berekend.","The verdict is the worse of average and maximum weight. The items below are aggravating factors: with two or more the real load is probably higher than calculated."],
    ["Geen TNO-account bij de hand? Gebruik KIM-PP: die geeft direct een score.","No TNO account at hand? Use KIM-PP: it gives a score right away."]],
  err:[["Alleen de lading wegen en het leeggewicht van de kar vergeten.","Weighing only the load and forgetting the empty weight of the cart."],
    ["De grenzen laten staan nadat afstand, frequentie of wielen zijn aangepast.","Leaving the limits in place after distance, frequency or wheels have changed."]]},
reba:{
  use:["Snelle beoordeling van één houding van het hele lichaam, bv. bij wisselend of onvoorspelbaar werk (onderhoud, schoonmaak, storingen). Het is een momentopname: duur en frequentie van de hele taak zitten er niet in.","Quick assessment of one whole-body posture, e.g. for varied or unpredictable work (maintenance, cleaning, breakdowns). It is a snapshot: duration and frequency of the whole task are not included."],
  prep:SNAP_PREP,
  steps:[
   [["Romp: hoek tussen de romp en de verticaal. Nek: hoek van het hoofd ten opzichte van de romp. Vink draaien of zijwaarts buigen apart aan.","Trunk: angle between the trunk and the vertical. Neck: angle of the head relative to the trunk. Tick twisting or side-bending separately."],
    ["Benen: Eén been / instabiel als het gewicht op één been rust of de ondergrond wiebelt. Kniebuiging geldt niet bij zitten.","Legs: Unilateral / unstable if the weight rests on one leg or the base wobbles. Knee flexion does not apply when sitting."],
    ["Last / kracht: het gewicht in de handen of de kracht die gezet wordt.","Load / force: the weight in the hands or the force exerted."]],
   [["Bovenarm: hoek tussen bovenarm en romp. Onderarm: 60–100° elleboogbuiging is de gunstige zone. Pols: meer dan 15° buigen of strekken is ongunstig.","Upper arm: angle between upper arm and trunk. Lower arm: 60–100° elbow flexion is the favourable zone. Wrist: more than 15° flexion or extension is unfavourable."],
    ["Grip: Goed = stevig handvat. Redelijk = acceptabel maar niet ideaal. Slecht = niet goed vast te houden. Onaanvaardbaar = geen grip, onveilig.","Coupling: Good = sturdy handle. Fair = acceptable but not ideal. Poor = hard to hold. Unacceptable = no grip, unsafe."]],
   [["Vink aan wat voor deze houding geldt. Elk vinkje telt 1 punt extra.","Tick what applies to this posture. Every tick adds 1 point."]]],
  read:[["1–3 laag, 4–7 gemiddeld (nader onderzoeken), 8–10 hoog (snel veranderen), 11 of meer zeer hoog (direct veranderen). De balken tonen welk lichaamsdeel het zwaarst scoort.","1–3 low, 4–7 medium (investigate further), 8–10 high (change soon), 11 or more very high (change now). The bars show which body part scores highest."]],
  err:[["Hoeken schatten van een foto die schuin is genomen. Dat geeft snel 10–20° fout.","Estimating angles from a photo taken at a slant. That easily gives a 10–20° error."]]},
rula:{
  use:["Snelle beoordeling van één houding bij overwegend zittend of staand werk waarbij vooral arm, nek en romp belast worden: inpakken, controle, assemblage, bediening. Voor houdingen van het hele lichaam gebruik je REBA.","Quick assessment of one posture in mainly seated or standing work loading mainly arm, neck and trunk: packing, inspection, assembly, operating. For whole-body postures use REBA."],
  prep:SNAP_PREP,
  steps:[
   [["Bovenarm: hoek tussen bovenarm en romp. Onderarm: 60–100° elleboogbuiging is gunstig. Pols: Neutraal = recht; daarna tot 15° en meer dan 15° buigen of strekken.","Upper arm: angle between upper arm and trunk. Lower arm: 60–100° elbow flexion is favourable. Wrist: Neutral = straight; then up to 15° and more than 15° flexion or extension."],
    ["Polsrotatie: Eindstand = de handpalm is helemaal naar boven of helemaal naar beneden gedraaid.","Wrist twist: End of range = the palm is turned fully up or fully down."],
    ["Statisch / herhaald: aanvinken als de houding langer dan 1 minuut wordt volgehouden of vaker dan 4 keer per minuut terugkomt.","Static / repeated: tick if the posture is held longer than 1 minute or returns more than 4 times per minute."]],
   [["Nek: hoek van het hoofd voorover. Romp: bij goed ondersteund zitten kies je de eerste optie.","Neck: forward angle of the head. Trunk: for well supported sitting choose the first option."],
    ["Benen: Niet gesteund = voeten hangen, of het gewicht is ongelijk verdeeld.","Legs: Not supported = feet dangling, or the weight is unevenly distributed."]]],
  read:[["1–2 aanvaardbaar, 3–4 nader onderzoeken, 5–6 binnenkort veranderen, 7 direct veranderen.","1–2 acceptable, 3–4 investigate further, 5–6 change soon, 7 change immediately."]],
  err:[["Een gemiddelde houding beoordelen. Kies één echt moment.","Assessing an average posture. Pick one real moment."]]},
screen:{
  use:["Werkplekcheck voor iedereen die 2 uur of meer per dag met een beeldscherm werkt. Geeft aandachtspunten, geen risicoscore.","Workplace check for anyone working with a screen for 2 hours or more per day. Gives attention points, not a risk score."],
  prep:[["Loop de werkplek langs samen met de medewerker terwijl die werkt zoals normaal. Een foto van opzij laat schermhoogte en zithouding goed zien.","Go through the workplace together with the worker while they work as usual. A photo from the side shows screen height and sitting posture well."]],
  steps:[
   [["Vink aan wat van toepassing is. Goed ingesteld betekent: voeten plat op de vloer of voetensteun, bovenbenen horizontaal, onderarmen ontspannen op blad of armsteunen, bovenrand van het scherm op of net onder ooghoogte, scherm op ongeveer een armlengte.","Tick what applies. Well adjusted means: feet flat on the floor or footrest, thighs horizontal, forearms relaxed on desk or armrests, top of the screen at or just below eye level, screen at about arm's length."]]],
  read:[["Los elk aangevinkt punt op. Laat medewerkers daarnaast zelf de TNO BAS-check invullen voor persoonlijk advies.","Resolve every ticked item. In addition, let workers complete the TNO BAS check themselves for personal advice."]],
  err:[]}
};
const FIG={niosh:`<svg viewBox="0 0 340 150" role="img" aria-label="H, V, A" style="width:100%;max-width:340px;display:block;margin:6px 0"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="132" x2="200" y2="132"/><circle cx="62" cy="28" r="9"/><path d="M62 38 L70 82 L60 108 L64 132 M70 82 L84 108 L80 132 M65 50 L96 70 L118 72"/><rect x="112" y="60" width="30" height="24" rx="2"/></g><g stroke="#0B4F8A" stroke-width="1.6" fill="#0B4F8A" font-size="12" font-family="system-ui,sans-serif"><line x1="72" y1="142" x2="118" y2="142"/><line x1="72" y1="138" x2="72" y2="146"/><line x1="118" y1="138" x2="118" y2="146"/><text x="90" y="128" stroke="none">H</text><line x1="156" y1="72" x2="156" y2="132"/><line x1="152" y1="72" x2="160" y2="72"/><text x="162" y="106" stroke="none">V</text><g transform="translate(270,84)"><circle r="4" stroke="none"/><line x1="0" y1="0" x2="0" y2="-56" stroke-dasharray="4 3"/><line x1="0" y1="0" x2="40" y2="-40"/><path d="M0 -26 A26 26 0 0 1 18.4 -18.4" fill="none"/><rect x="34" y="-56" width="20" height="16" fill="none" transform="rotate(45 44 -48)"/><text x="8" y="-30" stroke="none">A</text></g></g></svg>`};
const figCap=()=>T("H: van midden tussen de enkels tot midden van de handen. V: van vloer tot handen. A (bovenaanzicht): hoek tussen recht vooruit en de last.","H: from the midpoint between the ankles to the middle of the hands. V: from floor to hands. A (top view): angle between straight ahead and the load.");
let helpAll=(()=>{try{return localStorage.getItem('ergoflow.help')==='1'}catch(e){return false}})();
const helpOpen=new Set();
const bullets=a=>a&&a.length?`<ul class="glist">${a.map(x=>`<li>${esc(tr(x))}</li>`).join('')}</ul>`:'';
function stepGuide(m,n){ const g=MAN[m.id]; if(!g||!g.steps[n]) return ''; return `<div class="guide">${n===(m.id==='niosh'?1:-1)&&g.fig?FIG[g.fig]+`<p class="small muted" style="margin:0 0 6px">${figCap()}</p>`:''}${bullets(g.steps[n])}</div>`; }
function manualSheet(m,rerender){ const g=MAN[m.id]; if(!g) return; const inEval=!!rerender;
  openSheet(`<div class="row"><h2 class="grow">${T('Uitleg','Guide')}: ${esc(tr(m.short))}</h2><button class="btn sm" id="mclose">${T('Sluit','Close')}</button></div>
    ${inEval?`<label class="chk" style="border:0"><input type="checkbox" id="helpall" ${helpAll?'checked':''}><span>${T('Toon de uitleg altijd bij elke stap','Always show the guidance with every step')}</span></label>`:''}
    <h3 class="gh">${T('Waarvoor gebruik je dit?','What is it for?')}</h3><p class="gp">${esc(tr(g.use))}</p>
    <h3 class="gh">${T('Voordat je begint','Before you start')}</h3>${bullets(g.prep)}
    ${m.steps.map((s,n)=>`<h3 class="gh">${T('Stap','Step')} ${n+1} · ${esc(tr(s.title))}</h3>${n===1&&g.fig?FIG[g.fig]+`<p class="small muted" style="margin:0 0 6px">${figCap()}</p>`:''}${bullets(g.steps[n])}`).join('')}
    <h3 class="gh">${T('De uitkomst lezen','Reading the result')}</h3>${bullets(g.read)}
    ${g.err.length?`<h3 class="gh">${T('Veelgemaakte fouten','Common mistakes')}</h3>${bullets(g.err)}`:''}
    <p class="ref">${esc(m.ref)}</p>`);
  $('#mclose').onclick=closeSheet;
  if($('#helpall')) $('#helpall').onchange=e=>{ helpAll=e.target.checked; try{localStorage.setItem('ergoflow.help',helpAll?'1':'0');}catch(err){} helpOpen.clear(); rerender&&rerender(); }; }

/* ===== manuals for the added methods + external tools, and the method-selection guide ===== */
const HSE_READ=[["Elke factor krijgt groen, oranje of rood. Het eindoordeel is de slechtste factor. De totaalscore is bedoeld om taken tegen elkaar af te zetten (hoogste eerst aanpakken), niet als actieniveau.","Each factor gets green, amber or red. The verdict is the worst factor. The total score is meant to rank tasks against each other (tackle the highest first), not as an action level."],
  ["Pak eerst de rode factoren aan, daarna de oranje.","Tackle the red factors first, then the amber ones."]];
Object.assign(MAN,{
mac:{use:["Snelle beoordeling van tillen of dragen zonder meetlint: je kijkt naar de houding en kiest per factor een kleur. Handig om in één ronde veel taken te rangschikken. Niet voor duwen en trekken (RAPP) of repeterend licht werk (ART).","Quick assessment of lifting or carrying without a tape measure: you look at the posture and pick a colour per factor. Useful to rank many tasks in one round. Not for pushing/pulling (RAPP) or repetitive light work (ART)."],
  prep:KIM_GEN.concat([["Beoordeel altijd het slechtste moment: het oppakken van de onderste laag, het wegzetten op de hoogste.","Always assess the worst moment: picking from the bottom layer, placing on the highest."]]),
  steps:[[["Gewicht: weeg de last of lees het etiket. Frequentie per uur: tel een kwartier en vermenigvuldig met 4. Eén keer per dag = 0,125 per uur.","Weight: weigh the load or read the label. Frequency per hour: count for a quarter of an hour and multiply by 4. Once a day = 0.125 per hour."],
    ["Kies Dragen als de last verder dan 2 m wordt gedragen; dan komen draagafstand en obstakels erbij.","Choose Carrying if the load is carried more than 2 m; then carry distance and obstacles are added."]],
   [["Afstand handen – onderrug: kijk van opzij. Bovenarmen recht naar beneden en rug recht = dicht. Armen naar voren óf rug voorover = matig. Armen gestrekt, of allebei = ver.","Hand distance from lower back: look from the side. Upper arms straight down and back upright = close. Arms forward or back bent = moderate. Arms outstretched, or both = far."],
    ["Verticale zone: kijk naar de handen aan het begin én het eind van de tilhandeling; neem de slechtste.","Vertical zone: look at the hands at the start and end of the lift; take the worst."],
    ["Grip: Goed = handvatten die bij de last passen, of een compact voorwerp dat je goed omvat. Redelijk = geen handvatten maar goed onderaan te pakken. Slecht = pinchgreep, glad, scherp, slap of te groot.","Grip: Good = handles suited to the load, or a compact object you can wrap your hands around. Reasonable = no handles but easily held underneath. Poor = pinch grip, slippery, sharp, non-rigid or bulky."]],
   [["Vloer en omgeving: beoordeel de slechtste situatie die regelmatig voorkomt (buiten: bij regen).","Floor and environment: assess the worst situation that occurs regularly (outdoors: in rain)."],
    ["Draagafstand: de werkelijk gelopen route, niet hemelsbreed.","Carry distance: the actual route walked, not as the crow flies."]]],
  read:HSE_READ.concat([["Paars bij gewicht/frequentie betekent: eerst de last of frequentie verlagen, daarna pas verder beoordelen.","Purple for weight/frequency means: reduce the load or frequency first, then assess further."]]),
  err:[["Frequentie per dag invullen in plaats van per uur.","Entering frequency per day instead of per hour."],["Het gemakkelijkste moment beoordelen.","Assessing the easiest moment."]]},
rapp:{use:["Snelle beoordeling van duwen en trekken van karren, rolcontainers en palletwagens, zonder krachtmeting: negen factoren met een kleur. Slepen, rollen of kantelen zonder wielen valt buiten deze app (RAPP deel B of KIM-BF).","Quick assessment of pushing and pulling carts, roll cages and pallet trucks, without force measurement: nine factors with a colour. Dragging, rolling or tipping without wheels is outside this app (RAPP part B or KIM-BF)."],
  prep:KIM_GEN.concat([["Loop de route mee en kijk naar vloer, drempels, deuren en bochten. Vraag naar het onderhoud van de wielen.","Walk the route and look at floor, sills, doors and bends. Ask about wheel maintenance."]]),
  steps:[[["Type: Klein = de medewerker draagt een deel van het gewicht (kruiwagen, steekwagen). Middel = kar op drie of meer wielen. Groot = bestuurbaar, zoals een palletwagen, of op rails.","Type: Small = the worker supports part of the weight (wheelbarrow, sack truck). Medium = cart on three or more wheels. Large = steerable, such as a pallet truck, or on rails."],
    ["Gewicht: middel plus lading; bij wisselende ladingen de zwaarste die regelmatig voorkomt.","Weight: equipment plus load; with varying loads the heaviest that occurs regularly."]],
   [["Houding: kijk tijdens het wegduwen. Handen tussen heup en schouder en rug recht is goed. Trekken met de arm naar achteren of naast het lichaam is slecht.","Posture: watch during the push-off. Hands between hip and shoulder with a straight back is good. Pulling with the arm behind or beside the body is poor."],
    ["Werkpatroon: repeterend = vijf of meer verplaatsingen per minuut.","Work pattern: repetitive = five or more transfers per minute."]],
   [["Vloer: een helling van 3° is ongeveer 5 cm per meter, 5° ongeveer 9 cm per meter.","Floor: a 3° slope is about 5 cm per metre, 5° about 9 cm per metre."],
    ["Obstakels: elk soort telt één keer, hoe vaak het ook voorkomt.","Obstacles: each type counts once, however often it occurs."]]],
  read:HSE_READ.concat([["Overschrijdt de lading het draagvermogen van het middel, dan is het paars: eerst oplossen.","If the load exceeds the rated capacity of the equipment it is purple: fix that first."]]),
  err:[["De kar leeg beoordelen. Neem de volle kar.","Assessing the cart empty. Take the full cart."]]},
art:{use:["Repeterend werk met armen en handen dat minstens 1–2 uur per dag voorkomt. Twaalf factoren met een kleur en een blootstellingsscore. Beoordeel elke arm apart als ze verschillend werken.","Repetitive work with arms and hands that occurs at least 1–2 hours a day. Twelve factors with a colour and an exposure score. Assess each arm separately if they work differently."],
  prep:[["Film één minuut en tel de herhalingen van het bewegingspatroon. Vraag de medewerker zelf hoe zwaar de kracht is: licht, matig, sterk of zeer sterk.","Film one minute and count the repetitions of the motion pattern. Ask the worker how heavy the force is: light, moderate, strong or very strong."]],
  steps:[[["Armbewegingen gaan over hoe vaak de arm in beweging is; herhaling over hoe vaak hetzelfde patroon terugkomt per minuut.","Arm movements is about how often the arm is moving; repetition about how often the same pattern returns per minute."]],
   [["Matig = merkbare inspanning bij knijpen, drukken, hendels of gereedschap. Sterk = duidelijk zwaar. Zeer sterk = bijna maximaal. Sterk voor bijna de hele tijd of zeer sterk is volgens ART altijd onaanvaardbaar.","Moderate = noticeable effort in pinching, pressing, levers or tools. Strong = obviously heavy. Very strong = near maximum. Strong almost all the time, or very strong, is always unacceptable according to ART."]],
   [["Rug telt als ongunstig vanaf 20° buigen of draaien. Elleboog geheven = tot borsthoogte en niet ondersteund. Pinchgreep = met de vingertoppen; brede vingergreep = hand ver gespreid.","Back counts as awkward from 20° of bending or twisting. Elbow raised = to chest height and unsupported. Pinch grip = with the fingertips; wide finger grip = hand spread wide."]],
   [["Pauze = minstens 5–10 minuten ander werk of rust; korte onderbrekingen van 10 seconden om de paar minuten tellen ook als voldoende.","Break = at least 5–10 minutes of other work or rest; short interruptions of 10 seconds every few minutes also count as sufficient."],
    ["Duur: alleen de uren dat de taak echt wordt gedaan. Korter dan 2 uur halveert de score; meer dan 8 uur × 1,5.","Duration: only the hours the task is really done. Less than 2 hours halves the score; more than 8 hours × 1.5."]]],
  read:[["Blootstellingsscore = som van de factoren × duurfactor. 0–11 laag, 12–21 gemiddeld, 22 of meer hoog.","Exposure score = sum of the factors × duration multiplier. 0–11 low, 12–21 medium, 22 or more high."],HSE_READ[1]],
  err:[["Vingerbewegingen meetellen als herhaling; het gaat om arm en hand.","Counting finger movements as repetition; it is about the arm and hand."]]},
owas:{use:["Grove classificatie van een houding in vier actiecategorieën. De kracht van OWAS is turven: noteer bijvoorbeeld elke 30 seconden de houding en zie welk deel van de tijd belastend is. Voor een gedetailleerde hoekbeoordeling gebruik je REBA of RULA.","Coarse classification of a posture into four action categories. The strength of OWAS is sampling: note the posture every 30 seconds, say, and see what share of the time is harmful. For a detailed angle assessment use REBA or RULA."],
  prep:[["Neem een filmpje en pauzeer op vaste tijdstippen; maak per moment een OWAS-beoordeling (gebruik Kenmerk voor het tijdstip).","Take a video and pause at fixed intervals; make one OWAS assessment per moment (use Label for the time)."]],
  steps:[[["Rug gebogen = duidelijk voorover (ongeveer 20° of meer). Gedraaid = schouders gedraaid ten opzichte van de heupen.","Back bent = clearly forward (about 20° or more). Twisted = shoulders turned relative to the hips."],
    ["Armen: het gaat om de elleboog op of boven schouderhoogte.","Arms: it is about the elbow at or above shoulder level."],
    ["Benen: gebogen knieën = duidelijk gebogen, hurken of half zitten.","Legs: bent knees = clearly bent, squatting or half-sitting."]]],
  read:[["1 = geen maatregelen, 2 = binnenkort, 3 = zo snel mogelijk, 4 = direct. Tel hoeveel procent van de momenten in 3 of 4 valt.","1 = no action, 2 = in the near future, 3 = as soon as possible, 4 = immediately. Count the percentage of moments in 3 or 4."]],
  err:[["Eén toevallig moment beoordelen. OWAS werkt met veel momenten.","Assessing one random moment. OWAS works with many moments."]]},
si:{use:["Hand, pols en elleboog bij repeterend werk waarbij kracht wordt gezet: zes factoren die je vermenigvuldigt. Kort in te vullen; vraagt een goede inschatting van de kracht.","Hand, wrist and elbow in repetitive forceful work: six factors you multiply. Quick to fill in; needs a good estimate of the force."],
  prep:[["Vraag de medewerker de zwaarste inspanning in de cyclus te scoren op de Borg CR-10-schaal (0 niets, 10 maximaal). Film een minuut om inspanningen per minuut en het aandeel van de cyclus te tellen.","Ask the worker to rate the heaviest exertion in the cycle on the Borg CR-10 scale (0 nothing, 10 maximal). Film a minute to count exertions per minute and the share of the cycle."]],
  steps:[[["Duur van de inspanning = het deel van de cyclus waarin de hand kracht zet, in procenten.","Duration of exertion = the share of the cycle in which the hand exerts force, in percent."],
    ["Inspanningen per minuut = aantal keer dat de hand kracht zet, niet het aantal producten.","Efforts per minute = number of times the hand exerts force, not the number of products."],
    ["Houding: neutraal = pols recht, in lijn met de onderarm.","Posture: neutral = wrist straight, in line with the forearm."]]],
  read:[["SI ≤ 3 waarschijnlijk veilig, 3–7 onzeker, > 7 waarschijnlijk gevaarlijk. Omdat het een product is, telt elke factor even hard: de balken tonen welke het meest bijdraagt.","SI ≤ 3 probably safe, 3–7 uncertain, > 7 probably hazardous. Because it is a product, every factor counts equally: the bars show which contributes most."]],
  err:[["De kracht zelf inschatten in plaats van de medewerker te vragen.","Estimating the force yourself instead of asking the worker."]]},
hal:{use:["Monotone hand-armtaken van 4 uur of meer per dag, zoals een vaste plek aan een lijn. Twee getallen: hoe druk de handen zijn (HAL) en hoe zwaar de zwaarste inspanning is (piekkracht). Voor kortere of wisselende taken: HARM of ART.","Mono-task hand work of 4 hours or more per day, such as a fixed station on a line. Two numbers: how busy the hands are (HAL) and how heavy the heaviest exertion is (peak force). For shorter or varied tasks: HARM or ART."],
  prep:[["Kijk minstens 10 minuten en let op het tempo en de pauzes tussen bewegingen. Vraag de medewerker de zwaarste greep of duw in de cyclus te scoren op de Borg CR-10-schaal.","Observe for at least 10 minutes and note the pace and pauses between movements. Ask the worker to rate the heaviest grip or push in the cycle on the Borg CR-10 scale."]],
  steps:[[["HAL: kies de omschrijving die het beste past; tussenwaarden mogen (bv. 5).","HAL: pick the description that fits best; intermediate values are allowed (e.g. 5)."],
    ["Piekkracht: Borg 0–10 van de medewerker, of gemeten kracht als percentage van het maximum gedeeld door 10.","Peak force: worker's Borg 0–10, or measured force as a percentage of maximum divided by 10."]]],
  read:[["Onder de actielimiet groen, tussen actielimiet en TLV oranje, boven de TLV rood. PFI = piekkracht ÷ TLV: boven 1 is te hoog.","Below the action limit green, between action limit and TLV amber, above the TLV red. PFI = peak force ÷ TLV: above 1 is too high."]],
  err:[["Toepassen op een taak van 2 uur. Dan is de TLV niet bedoeld.","Applying it to a 2-hour task. The TLV is not meant for that."]]}});
EXT.forEach(([id,,,link,scope])=>{ MAN[id]={use:scope,prep:[["Open de tool via de link, voer de beoordeling daar uit en neem hier het oordeel, de score en de belangrijkste knelpunten over.","Open the tool via the link, carry out the assessment there and record the verdict, score and main issues here."]],
  steps:[[["Kies het stoplicht dat de tool geeft. Geeft de tool geen kleur, kies dan op basis van de conclusie van de tool.","Choose the traffic light the tool gives. If the tool gives no colour, choose based on its conclusion."]]],
  read:[["De berekening is niet in ErgoFlow nagebouwd. Bewaar de uitkomst van de tool zelf (schermafbeelding als foto, of pdf) als bewijs.","The calculation is not reproduced in ErgoFlow. Keep the tool's own output (screenshot as photo, or pdf) as evidence."]],err:[]}; });

/* ---- chooser (which method when) ---- */
const QUESTIONS=[
 {q:['Kun je de situatie meten (gewicht, afstanden, krachten)?','Can you measure the situation (weight, distances, forces)?'],a:[['calc',['Ja, ik meet','Yes, I measure']],['quick',['Nee, ik kijk en schat','No, I observe and estimate']]]},
 {q:['Wat wil je als uitkomst?','What result do you want?'],a:[['limit',['Een grenswaarde (hoe zwaar/vaak mag het)','A limit (how heavy/often is acceptable)']],['rank',['Een score om taken te vergelijken','A score to compare tasks']],['posture',['Beoordeling van één houding op een foto','Assessment of one posture from a photo']]]}];
function chooserSheet(taskId){ const st={g:null};
  const render=()=>{ if(!st.g){ openSheet(`<h2>${T('Welke belasting wil je beoordelen?','Which load do you want to assess?')}</h2><p class="small muted">${T('Kies het soort belasting; daarna zie je welke methode wanneer past. Niet zeker welke belasting er speelt? Beantwoord dan eerst de vragen op de taakpagina.','Choose the kind of load; then you see which method fits when. Not sure which loads occur? Answer the questions on the task page first.')}</p>
      ${GROUPS.map(([g,l])=>{ const ms=Object.values(M).filter(m=>m.group===g), inapp=ms.filter(m=>!m.ext).length; return `<button class="mitem" data-g="${g}"><b>${esc(tr(l))}</b><span class="small muted">${inapp} ${T('in de app','in the app')} · ${ms.length-inapp} ${T('extern','external')}</span></button>`; }).join('')}
      <button class="btn ghost" id="guidebtn" style="margin-top:8px">${T('Keuzewijzer lezen','Read the selection guide')}</button>`);
      $$('[data-g]',$('#panel')).forEach(b=>b.onclick=()=>{ st.g=b.dataset.g; render(); }); $('#guidebtn').onclick=guideSheet; return; }
    const ms=Object.values(M).filter(m=>m.group===st.g), tiers=['screen','quick','calc','snapshot','ext'].filter(t=>ms.some(m=>m.tier===t));
    openSheet(`<div class="row"><button class="btn sm ghost" id="back">${ico('back')}</button><h2 class="grow">${esc(tr(GROUPS.find(x=>x[0]===st.g)[1]))}</h2></div>
      ${CHOOSE[st.g]?`<p class="advice">${esc(tr(CHOOSE[st.g]))}</p>`:''}
      ${tiers.map(t=>`<div class="mgroup">${esc(tr(TIER[t]))}</div>`+ms.filter(m=>m.tier===t).map(m=>`<button class="mitem" data-m="${m.id}"><b>${esc(tr(m.name))} ${m.ext?`<span class="tag ext">${T('extern','external')}</span>`:`<span class="tag">${T('in app','in app')}</span>`}</b><span class="small">${esc(tr(WHEN[m.id]||m.scope))}</span></button>`).join('')).join('')}`);
    $('#back').onclick=()=>{ st.g=null; render(); };
    $$('[data-m]',$('#panel')).forEach(b=>b.onclick=async()=>{ const ne=await createEval(taskId,b.dataset.m); location.hash='#/e/'+ne.id; }); };
  render(); }
function guideSheet(){ const row=(g,l)=>{ const ms=Object.values(M).filter(m=>m.group===g); return `<h3 class="gh">${esc(tr(l))}</h3><p class="gp">${esc(tr(CHOOSE[g]||['','']))}</p><ul class="glist">${ms.map(m=>`<li><b>${esc(tr(m.short))}</b>${m.ext?' ('+T('extern','external')+')':''} — ${esc(tr(WHEN[m.id]||m.scope))}</li>`).join('')}</ul>`; };
  openSheet(`<div class="row"><h2 class="grow">${T('Keuzewijzer methoden','Method selection guide')}</h2><button class="btn sm" id="mclose">${T('Sluit','Close')}</button></div>
    <p class="gp">${T('Werk in drie stappen: (1) screen de taak met de vragen op de taakpagina, (2) kies per aanwezige belasting één snelle methode, (3) meet en bereken alleen waar de snelle methode oranje of rood geeft, of waar je een grenswaarde nodig hebt om een maatregel te onderbouwen.','Work in three steps: (1) screen the task with the questions on the task page, (2) pick one quick method per load present, (3) measure and calculate only where the quick method gives amber or red, or where you need a limit to justify a measure.')}</p>
    <h3 class="gh">${T('Soorten methoden','Kinds of methods')}</h3><ul class="glist">${['screen','quick','calc','snapshot','ext'].map(t=>`<li><b>${esc(tr(TIER[t]))}</b> — ${esc(tr({screen:['grof, zonder score, om te bepalen wat verder moet.','coarse, no score, to decide what needs a closer look.'],quick:['observeren en kiezen uit categorieën; 10–20 minuten per taak; goed genoeg voor de meeste RI&E-vragen.','observe and pick from categories; 10–20 minutes per task; good enough for most risk-inventory questions.'],calc:['meetlint, weegschaal of dynamometer; geeft grenswaarden en is het sterkst om maatregelen te onderbouwen.','tape measure, scale or dynamometer; gives limits and is strongest to justify measures.'],snapshot:['één moment, meestal met een foto; zegt niets over duur of frequentie.','one moment, usually from a photo; says nothing about duration or frequency.'],ext:['niet in de app nagebouwd; je legt alleen de uitkomst vast.','not reproduced in the app; you only record the result.']}[t]))}</li>`).join('')}</ul>
    <h3 class="gh">${T('Vuistregels','Rules of thumb')}</h3><ul class="glist"><li>${T('Gebruik voor vergelijkbare taken steeds dezelfde methode, anders zijn scores niet te vergelijken.','Use the same method for comparable tasks, otherwise scores cannot be compared.')}</li><li>${T('Nederlandse Arbo-praktijk: NIOSH voor tillen, KIM-PP of DUTCH voor duwen/trekken, HARM voor hand-arm, WHI voor houdingen. De KIM-familie is een goede uniforme set als je één stijl wilt.','Dutch practice: NIOSH for lifting, KIM-PP or DUTCH for push/pull, HARM for hand-arm, WHI for postures. The KIM family is a good uniform set if you want one style.')}</li><li>${T('Bij klachten van medewerkers altijd een deskundige betrekken, wat de score ook zegt.','With worker complaints always involve an expert, whatever the score says.')}</li></ul>
    ${GROUPS.map(([g,l])=>row(g,l)).join('')}`);
  $('#mclose').onclick=closeSheet; }

/* ===== manuals for the third batch + the methods overview page ===== */
Object.assign(MAN,{
ocra:{use:["De uitgebreide referentiemethode voor repeterend werk (EN 1005-5, ISO 11228-3). Kost meer tijd dan HARM of ART, maar geeft een score die internationaal vergelijkbaar is en die ook een cyclus van enkele seconden goed beoordeelt.","The extensive reference method for repetitive work (EN 1005-5, ISO 11228-3). Takes more time than HARM or ART, but gives an internationally comparable score that also handles cycles of a few seconds well."],
  prep:[["Film 3–5 cycli van dichtbij en tel: bewegingen per minuut, hoe lang de arm stilstaat, en welk deel van de cyclus elke houding en kracht voorkomt. Vraag de medewerker de krachten te scoren op Borg CR-10.","Film 3–5 cycles up close and count: movements per minute, how long the arm is static, and what share of the cycle each posture and force occurs. Ask the worker to rate the forces on Borg CR-10."]],
  steps:[[["Frequentie: kies de omschrijving van tempo én pauzemogelijkheid die past. De app neemt het hoogste van dynamisch en statisch.","Frequency: pick the description of pace and pause possibility that fits. The app takes the higher of dynamic and static."]],
   [["Vul per krachtniveau in welk deel van de tijd het voorkomt; de drie niveaus worden opgeteld. Borg 3–4 = duidelijk voelbaar, 5–7 = zwaar, ≥ 8 = bijna maximaal.","Enter per force level what share of the time it occurs; the three levels are added. Borg 3–4 = clearly noticeable, 5–7 = hard, ≥ 8 = near maximal."]],
   [["Per gewricht het aandeel van de cyclustijd in de ongunstige stand. Alleen het hoogste gewricht telt, plus de punten voor repetitiviteit.","Per joint the share of cycle time in the awkward position. Only the highest joint counts, plus the points for stereotypy."]],
   [["Van de fysieke extra factoren telt alleen de hoogste; het werktempo komt daar bovenop.","Of the physical extra factors only the highest counts; work pace is added on top."]],
   [["Herstel: tel de uren repeterend werk zonder een pauze van 8–10 minuten (lunch en einde dienst tellen als pauze). Werkduur: netto minuten repeterend werk per dag.","Recovery: count the hours of repetitive work without an 8–10 minute break (lunch and end of shift count as breaks). Duration: net minutes of repetitive work per day."]]],
  read:[["Score < 7,5 aanvaardbaar, 7,6–11 beperkt, 11,1–14 laag, 14,1–22,5 gemiddeld, > 22,5 hoog. Herstel en werkduur zijn vermenigvuldigers: extra pauzes werken direct door.","Score < 7.5 acceptable, 7.6–11 borderline, 11.1–14 low, 14.1–22.5 medium, > 22.5 high. Recovery and duration are multipliers: extra breaks work through directly."]],
  err:[["Percentages van de dag invullen waar de cyclus wordt bedoeld.","Entering shares of the day where the cycle is meant."]]},
qec:{use:["Snelle check van rug, schouder/arm, pols/hand en nek in één taak, waarbij de medewerker zelf zeven vragen beantwoordt. Handig als je één instrument wilt voor gemengde taken en om een verbetering te meten.","Quick check of back, shoulder/arm, wrist/hand and neck in one task, with the worker answering seven questions. Useful when you want one instrument for mixed tasks and to measure an improvement."],
  prep:[["Observeer eerst de slechtste situatie in de taak (stap 1–2), stel daarna de vragen aan de medewerker (stap 3).","Observe the worst situation in the task first (steps 1–2), then ask the worker the questions (step 3)."]],
  steps:[[["Kies bij B het soort taak: stilstaand (zitten/staan) of lasten hanteren. Dat bepaalt welke tabellen gebruikt worden.","At B choose the kind of task: stationary (sitting/standing) or handling loads. That decides which tables are used."]],
   [["Pols: gebogen of geknikt = een duidelijke hoek is te zien.","Wrist: bent or deviated = a clear angle is visible."]],
   [["Laat de medewerker zelf antwoorden; vul niet voor hem of haar in.","Let the worker answer; do not fill it in for them."]]],
  read:[["Per lichaamsdeel een niveau; het totaal E is een percentage van het maximum. ≤ 40 % aanvaardbaar, 41–50 nader onderzoeken, 51–70 binnenkort veranderen, > 70 direct veranderen. Rijden, trillingen, tempo en stress staan apart.","A level per body region; the total E is a percentage of the maximum. ≤ 40 % acceptable, 41–50 investigate further, 51–70 change soon, > 70 change now. Driving, vibration, pace and stress are shown separately."]],
  err:[["Beide taaksoorten bij B invullen; kies er één.","Filling in both task kinds at B; choose one."]]},
verv:{use:["Langdurig staand werk: hoe lang op de voeten, hoe lang stil op één plek, en de omstandigheden. Specifiek voor staan, wat WHI en KIM slechts zijdelings meenemen.","Prolonged standing work: how long on the feet, how long still in one place, and the conditions. Specific to standing, which WHI and KIM only touch on."],
  prep:[["Bepaal de totale tijd op de voeten en de langste periode stilstaan op ongeveer 1 m².","Determine the total time on the feet and the longest period standing still on about 1 m²."]],
  steps:[[["Intensiteit gaat over stilstaan; loopt de medewerker regelmatig meer dan 2 m, dan wordt die score verlaagd of nul.","Intensity is about standing still; if the worker regularly walks more than 2 m, that score is reduced or zero."]],[["Ondergrond: roostervloeren en hellingen tellen zwaar.","Floor: gratings and slopes weigh heavily."]],[["Kies bij maatregelen de beste voorziening die echt gebruikt wordt. Afwisseling: na hoeveel minuten kan de medewerker minstens 15 minuten zitten?","For measures choose the best provision that is actually used. Alternation: after how many minutes can the worker sit for at least 15 minutes?"]]],
  read:[["≤ 50 groen, 50–100 geel (maatregelen aanbevolen), > 100 rood (maatregelen noodzakelijk). Zitgelegenheid en afwisseling zijn vermenigvuldigers en werken sterk door.","≤ 50 green, 50–100 yellow (measures recommended), > 100 red (measures necessary). Seating and alternation are multipliers and have a strong effect."]],err:[]},
lifft:{use:["Rugbelasting van alle tiltaken op een dag bij elkaar, met maar drie getallen per taak. Sterk om te laten zien welke taak de meeste schade oplevert en wat een maatregel scheelt. Vult NIOSH aan; vervangt het niet bij één taak met veel factoren.","Back loading of all lifting tasks in a day combined, with only three numbers per task. Strong at showing which task causes most damage and what a measure saves. Complements NIOSH; does not replace it for a single task with many factors."],
  prep:[["Meet de horizontale afstand van de heup (grote trochanter, ter hoogte van L5/S1) tot het midden van de last op het verste punt van de tilbeweging — niet vanaf de tenen en niet tot de rand.","Measure the horizontal distance from the hip (greater trochanter, level of L5/S1) to the centre of the load at the furthest point of the lift — not from the toes and not to the edge."]],
  steps:[[["Elke last met een ander gewicht of afstand is een aparte taak. Herhalingen per dag: tel of schat over de hele dienst.","Every load with a different weight or distance is a separate task. Repetitions per day: count or estimate over the whole shift."]]],
  read:[["Kans < 25 % laag, 25–50 % gemiddeld, > 50 % hoog. De percentages per taak tonen waar de schade vandaan komt. Boven 100 Nm piekmoment (bv. 25 kg op 40 cm) is de tool voorzichtig te gebruiken.","Probability < 25 % low, 25–50 % moderate, > 50 % high. The task percentages show where the damage comes from. Above a 100 Nm peak moment (e.g. 25 kg at 40 cm) use the tool with caution."]],
  err:[["De gemiddelde afstand nemen in plaats van de grootste.","Taking the average distance instead of the largest."]]},
duet:{use:["Hand-, pols- en elleboogbelasting van alle taken op een dag bij elkaar, met twee getallen per taak. Goed bij taakroulatie en bij taken met sterk wisselende krachten.","Hand, wrist and elbow loading of all tasks in a day combined, with two numbers per task. Good with job rotation and with tasks of strongly varying forces."],
  prep:[["Laat de medewerker (of een getrainde observator) de inspanning per taak scoren op de OMNI-RES-schaal 0–10. Tel de inspanningen per minuut en reken om naar de dag.","Let the worker (or a trained observer) rate the exertion per task on the OMNI-RES 0–10 scale. Count exertions per minute and convert to the day."]],
  steps:[[["Eén inspanning = één keer grijpen, knijpen, drukken of draaien. Bij een taak met verschillende krachtniveaus maak je per niveau een aparte regel.","One exertion = one grip, pinch, press or turn. For a task with different force levels make a separate line per level."]]],
  read:[["Kans < 25 % laag, 25–50 % gemiddeld, > 50 % hoog; schade boven 0,03 per dag overschrijdt het herstelvermogen van pezen. Eén zware taak met weinig herhalingen kan bijna alle schade veroorzaken.","Probability < 25 % low, 25–50 % moderate, > 50 % high; damage above 0.03 per day exceeds tendon repair capacity. One heavy task with few repetitions can cause nearly all the damage."]],err:[]},
nfr:{use:["Elf ja/nee-stellingen over vermoeidheid na het werk, in te vullen door de medewerker. Geen taakbeoordeling maar een signaal dat een functie energetisch te zwaar is. Gebruik bij voorkeur anoniem bij een groep, bv. per ploeg.","Eleven yes/no statements about fatigue after work, completed by the worker. Not a task assessment but a signal that a job is energetically too heavy. Use preferably anonymously with a group, e.g. per shift."],
  prep:[["Vul de lijst niet zelf in voor iemand; laat de medewerker antwoorden over een gewone werkweek.","Do not fill in the list for someone; let the worker answer about an ordinary working week."]],
  steps:[[["Stelling 4 is omgekeerd geformuleerd: fit na het eten = geen herstelbehoefte. De app rekent dat om.","Statement 4 is reversed: fit after dinner = no need for recovery. The app converts that."]]],
  read:[["Score 0–100; vanaf 55 (6 van 11) verhoogd. Bekijk verschillen tussen groepen en na maatregelen eerder dan één absolute waarde.","Score 0–100; from 55 (6 of 11) elevated. Look at differences between groups and after measures rather than one absolute value."]],err:[]},
ohiopp:{use:["Toetsen van een gemeten duw- of trekkracht aan biomechanische grenzen voor de rug: rechtdoor met twee handen, draaien met twee handen, of trekken met één hand. Alleen voor startkrachten.","Testing a measured push or pull force against biomechanical limits for the back: straight with two hands, turning with two hands, or pulling with one hand. Initial forces only."],
  prep:[["Meet met een dynamometer horizontaal, vanuit stilstand, de kracht die nodig is om de kar in beweging te brengen; herhaal drie keer en neem het gemiddelde. Meet de handhoogte vanaf de vloer.","Measure with a dynamometer horizontally, from standstill, the force needed to set the cart in motion; repeat three times and take the average. Measure hand height from the floor."]],
  steps:[[["Bij draaien met twee handen vul je ook de afstand tussen de handen in (30–90 cm); de grens geldt dan voor kracht × afstand in kg·cm.","For turning with two hands also enter the distance between the hands (30–90 cm); the limit then applies to force × distance in kg·cm."]]],
  read:[["Groen aanvaardbaar voor meer dan 80 % van de medewerkers, geel 50–80 %, rood minder dan 50 %. Voor lange afstanden zijn volhoudkrachten bepalend: gebruik dan Liberty Mutual / Snook.","Green acceptable for more than 80 % of workers, yellow 50–80 %, red less than 50 %. For long distances sustained forces decide: use Liberty Mutual / Snook."]],err:[]}});

/* multi-moment manuals: fold step guidance into one step */
['owas','reba','rula'].forEach(id=>{ const g=MAN[id]; if(g&&g.steps.length>1) g.steps=[g.steps.flat()]; });
MAN.owas.steps[0].unshift(["Voeg per waarneming een moment toe (bv. elke 30 s tijdens 10 minuten, of elk kenmerkend moment van de cyclus). Het aandeel momenten in categorie 3–4 bepaalt het eindoordeel.","Add one moment per observation (e.g. every 30 s for 10 minutes, or each characteristic moment of the cycle). The share of moments in category 3–4 determines the verdict."]);
MAN.reba.steps[0].unshift(["Je kunt meerdere houdingen in één beoordeling zetten (bv. oppakken, dragen, neerzetten). De zwaarste bepaalt het oordeel; alle momenten komen in het rapport.","You can put several postures in one assessment (e.g. pick-up, carry, set-down). The worst determines the verdict; all moments go in the report."]);
MAN.rula.steps[0].unshift(["Meerdere houdingen in één beoordeling zijn mogelijk; de zwaarste bepaalt het oordeel.","Several postures in one assessment are possible; the worst determines the verdict."]);
MAN.ohiopp.steps[0].unshift(["Voeg drie metingen toe; de app rekent met het gemiddelde.","Add three readings; the app uses the average."]);
/* ===== manuals for batch 5 ===== */
Object.assign(MAN,{
lmlift:{use:["De Liberty Mutual-vergelijkingen (2021) zijn de opvolger van de Snook-tabellen: uit 40 jaar psychofysisch onderzoek (wat mensen zelf een hele dag aanvaardbaar vinden). Je krijgt per handeling het percentage vrouwen en mannen voor wie het gewicht aanvaardbaar is. Sterk om aan te tonen dat een gewicht ook voor een gemengde groep haalbaar is, en om te zien wat een lagere frequentie of betere hoogte oplevert.","The Liberty Mutual equations (2021) succeed the Snook tables: from 40 years of psychophysical research (what people themselves find acceptable for a whole day). Per action you get the share of women and men for whom the load is acceptable. Strong for showing that a load is feasible for a mixed group, and for seeing what a lower frequency or better height yields."],
  prep:[["Meet handhoogte bij begin en einde (vloer → handen), de horizontale reikafstand van het lichaam tot de handen op het verste punt, het gewicht en hoe vaak per minuut of per uur.","Measure hand height at start and end (floor → hands), the horizontal reach from the body to the hands at the furthest point, the load and how often per minute or per hour."]],
  steps:[[["Tillen = omhoog, neerzetten = omlaag; kies dragen als er meer dan een paar stappen gelopen wordt. Kies bij wie de taak uitvoert het criterium: bij een gemengde groep telt 75 % van de vrouwen.","Lifting = up, lowering = down; choose carrying when more than a few steps are walked. Under who performs the task pick the criterion: for a mixed group 75 % of women counts."],["Frequentie: één keer per 5 minuten = 0,2 per minuut of 12 per uur. Minder dan één keer per 8 uur wordt als één keer per 8 uur gerekend.","Frequency: once per 5 minutes = 0.2 per minute or 12 per hour. Less than once per 8 hours counts as once per 8 hours."]],
   [["Reikafstand is de grootste van begin en einde. Grip: alleen 'goed' bij echte handvatten; anders × 0,84.","Reach is the larger of start and end. Coupling: only 'good' with real handles; otherwise × 0.84."]]],
  read:[["Groen: aanvaardbaar voor ≥ 75 % van de gekozen groep; oranje 50–75 %; rood minder dan 50 %. De regels tonen ook het gewicht dat 75 % van de vrouwen en mannen aankan: een direct ontwerpgetal.","Green: acceptable to ≥ 75 % of the chosen group; amber 50–75 %; red fewer than 50 %. The rows also show the load 75 % of women and men can handle: a direct design figure."],["Grote hoogteverschillen en reiken kosten het meest; vergelijk met NIOSH voor een biomechanische grens.","Large height differences and reaching cost the most; compare with NIOSH for a biomechanical limit."]],
  err:[["Hoogtes in meters invullen: de app vraagt centimeters.","Entering heights in metres: the app asks for centimetres."]]},
