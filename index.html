/* ---- assessment view ---- */
function fieldHtml(f,ctx,path){ if(f.show&&!f.show(ctx)) return ''; const v=ctx[f.k], a=`data-k="${f.k}"${path}`, help=f.h?`<span class="help">${esc(tr(f.h))}</span>`:'';
  if(f.t==='chk') return `<label class="chk"><input type="checkbox" ${a} ${v?'checked':''}><span>${esc(tr(f.l))}</span></label>`;
  if(f.t==='num') return `<label class="fld"><span class="lbl">${esc(tr(f.l))}</span><span class="numwrap"><input type="number" inputmode="decimal" ${a} value="${esc(v??'')}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} step="${f.step||'any'}">${f.unit?`<span class="unit">${esc(tr(f.unit))}</span>`:''}</span>${help}</label>`;
  if(f.t==='text') return `<label class="fld"><span class="lbl">${esc(tr(f.l))}</span><input type="text" ${a} value="${esc(v??'')}"></label>`;
  if(f.t==='sel') return `<label class="fld"><span class="lbl">${esc(tr(f.l))}</span><select ${a}>${f.o.map(o=>`<option value="${o[0]}" ${String(v)===String(o[0])?'selected':''}>${esc(tr(o[1]))}</option>`).join('')}</select>${help}</label>`;
  if(f.t==='seg') return `<div class="fld"><span class="lbl">${esc(tr(f.l))}</span><div class="seg" role="group">${f.o.map(o=>`<button type="button" ${a} data-v="${o[0]}" aria-pressed="${String(v)===String(o[0])}">${esc(tr(o[1]))}</button>`).join('')}</div>${help}</div>`;
  if(f.t==='list'){ const arr=ctx[f.k]||[]; return arr.map((it,n)=>`<div class="sub"><div class="row"><b class="grow">${esc(tr(f.l))} ${n+1}</b>${arr.length>1?`<button class="btn sm ghost danger" data-lrem="${f.k}" data-idx="${n}">${T('Verwijder','Remove')}</button>`:''}</div>${f.item.map(s=>fieldHtml(s,it,` data-list="${f.k}" data-idx="${n}"`)).join('')}</div>`).join('')+`<button class="btn sm" data-ladd="${f.k}">${ico('plus')}${esc(tr(f.add))}</button>`; }
  return ''; }
function railHtml(r){ const hasNum=typeof r.score==='number'&&isFinite(r.score);
  let g=''; if(r.scale&&typeof r.score==='number'){ let prev=0; const mx=r.scale.max; g='<div class="gauge">'+r.scale.cuts.map(([at,b])=>{ const w=(at-prev)/mx*100; prev=at; return `<span class="b-${b}" style="width:${w}%"></span>`; }).join('')+`<i style="left:${Math.min(100,Math.max(0,(hasNum?r.score:mx)/mx*100))}%"></i></div>`; }
  const rows=(r.rows||[]).map(x=>`<div class="rrow"><span class="dot ${x.band?'b-'+x.band:''}"></span><span class="grow">${esc(tr(x.l))}</span><span class="muted">${esc(x.v===undefined?'':fmtN(x.v))}</span></div>`).join('');
  const parts=(r.parts||[]).length?`<h3 style="margin:12px 0 8px">${esc(tr(r.partsTitle||['Opbouw van de score','What drives the score']))}</h3>`+r.parts.map(p=>`<div class="part"><span>${esc(tr(p.l))}</span><span class="muted">${esc(p.txt||fmtN(r1(p.v))+(p.max?' / '+fmtN(p.max):''))}</span><span class="track"><b style="width:${Math.min(100,Math.max(0,(p.pen!==undefined?p.pen:p.v/p.max)*100))}%"></b></span></div>`).join(''):'';
  return {head:`<span class="big">${esc(scoreText(r))}${r.score!==null&&r.score!==undefined?`<small>${esc(r.label||T('punten','points'))}</small>`:''}</span><span class="grow verdict">${chip(r)}</span>`,gauge:g,
    more:(r.formula?`<p class="small muted" style="margin:0 0 8px">${T('Berekening','Calculation')}: ${esc(fmtN(r.formula))}</p>`:'')+rows+parts+(r.notes||[]).map(n=>`<p class="note">${esc(tr(n))}</p>`).join('')+(r.flags||[]).map(f=>`<div class="flag">${esc(tr(f))}</div>`).join('')}; }
function viewEval(id){ const e=getEval(id), m=M[e.method], t=getTask(e.taskId); $('#view').className='wide';
  setBar(tr(m.short)+' — '+(t.title||T('taak','task')),'#/t/'+t.id,`<button id="guide">${ico('help')}<span>${T('Uitleg','Guide')}</span></button>`);
  $('#view').innerHTML=`<div class="evalgrid"><div>
    <section class="card"><h2>${esc(tr(m.name))}</h2><p class="small muted" style="margin:0 0 12px">${esc(tr(m.scope))}${m.link?` <a href="${m.link}" target="_blank" rel="noopener">${T('Open TNO-tool','Open TNO tool')}</a>`:''} <button class="btn sm ghost" id="guide2" style="height:auto;padding:0">${T('Hoe vul ik dit in?','How do I fill this in?')}</button></p>
      <div class="fgrid"><div class="fld"><span class="lbl">${T('Situatie','Situation')}</span><div class="seg"><button data-ph="before" aria-pressed="${e.phase==='before'}">${phaseName('before')}</button><button data-ph="after" aria-pressed="${e.phase==='after'}">${phaseName('after')}</button></div></div>
      <label class="fld"><span class="lbl">${T('Kenmerk (optioneel)','Label (optional)')}</span><input type="text" id="elabel" value="${esc(e.label)}" placeholder="${T('bv. rechterhand, lijn 3','e.g. right hand, line 3')}"></label></div></section>
    <div id="steps"></div>
    <section class="card"><h2>${T('Foto\'s bij deze beoordeling','Photos for this assessment')}</h2><div class="photos" id="ephotos"></div></section>
    <section class="card"><label class="fld" style="margin:0"><span class="lbl">${T('Toelichting','Notes')}</span><textarea id="enotes">${esc(e.notes)}</textarea></label><p class="ref">${esc(m.ref)}</p></section>
    <div class="row noprint" style="flex-wrap:wrap">${e.phase==='before'?`<button class="btn" id="redo">${T('Opnieuw beoordelen na maatregelen','Re-assess after measures')}</button>`:''}<span class="grow"></span><button class="btn danger" id="dele">${T('Beoordeling verwijderen','Delete assessment')}</button></div>
  </div><aside class="rail" id="rail"><button class="railhead" id="railhead" aria-expanded="false"></button><div id="railgauge"></div><div class="more" id="railmore"></div></aside></div>`;
  const isOpen=n=>helpAll!==helpOpen.has(m.id+n);
  const steps=()=>{ $('#steps').innerHTML=m.steps.map((s,n)=>`<section class="card step"><h2><span class="n">${n+1}</span><span class="grow">${esc(tr(s.title))}</span><button type="button" class="helpbtn" data-help="${n}" aria-expanded="${isOpen(n)}" aria-label="${T('Uitleg bij deze stap','Guidance for this step')}">?</button></h2>${isOpen(n)?stepGuide(m,n):''}${s.fields.map(f=>fieldHtml(f,e.inputs,'')).join('')}</section>`).join(''); };
  const rail=(save=true)=>{ e.result=m.calc(e.inputs); const h=railHtml(e.result); $('#railhead').innerHTML=h.head; $('#railgauge').innerHTML=h.gauge; $('#railmore').innerHTML=h.more; if(save) saveSoon('evals',e); };
  steps(); rail(false);   /* rendering must never write: a write broadcasts a change to every other window and device */ renderPhotos($('#ephotos'),t.id,e.id);
  $('#guide').onclick=$('#guide2').onclick=()=>manualSheet(m,steps);
  $('#railhead').onclick=()=>{ const o=$('#rail').classList.toggle('open'); $('#railhead').setAttribute('aria-expanded',o); };
  const target=el=>el.dataset.list?e.inputs[el.dataset.list][+el.dataset.idx]:e.inputs;
  $('#steps').oninput=ev=>{ const el=ev.target; if(el.dataset.k&&(el.type==='number'||el.type==='text')){ target(el)[el.dataset.k]=el.value; rail(); } };
  $('#steps').onchange=ev=>{ const el=ev.target; if(!el.dataset.k) return; if(el.type==='checkbox'){ target(el)[el.dataset.k]=el.checked; steps(); rail(); } else if(el.tagName==='SELECT'){ target(el)[el.dataset.k]=el.value; steps(); rail(); } };
  $('#steps').onclick=ev=>{ const b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.help!==undefined){ const k=m.id+b.dataset.help; helpOpen.has(k)?helpOpen.delete(k):helpOpen.add(k); steps(); return; }
    if(b.dataset.v!==undefined&&b.dataset.k){ target(b)[b.dataset.k]=b.dataset.v; steps(); rail(); }
    else if(b.dataset.ladd){ const f=m.steps.flatMap(s=>s.fields).find(f=>f.k===b.dataset.ladd), it={}; f.item.forEach(s=>{ if(s.def!==undefined) it[s.k]=s.def; }); e.inputs[f.k].push(it); steps(); rail(); }
    else if(b.dataset.lrem){ e.inputs[b.dataset.lrem].splice(+b.dataset.idx,1); steps(); rail(); } };
  $$('[data-ph]').forEach(b=>b.onclick=()=>{ e.phase=b.dataset.ph; saveSoon('evals',e); viewEval(id); });
  $('#elabel').oninput=ev=>{ e.label=ev.target.value; saveSoon('evals',e); }; $('#enotes').oninput=ev=>{ e.notes=ev.target.value; saveSoon('evals',e); };
  if($('#redo')) $('#redo').onclick=async()=>{ const ne=await createEval(t.id,e.method,'after',e.inputs,e.label); location.hash='#/e/'+ne.id; };
  $('#dele').onclick=async()=>{ if(!confirm(T('Deze beoordeling verwijderen?','Delete this assessment?')))return; dropSave(e.id); for(const p of photosOf(t.id,e.id)){ p.evalId=null; await Store.put('photos',p); } await Store.del('evals',e.id); S.evals=S.evals.filter(x=>x.id!==e.id); location.hash='#/t/'+t.id; }; }

/* ---- photos ---- */
let photoTarget=null;
function renderPhotos(el,taskId,evalId){ const ps=photosOf(taskId,evalId);
  el.innerHTML=ps.map(p=>`<button class="ph" data-photo="${p.id}" title="${esc(p.caption)}"><img src="${p.thumb}" alt="${esc(p.caption||T('Foto','Photo'))}"></button>`).join('')+`<button class="ph add" data-addphoto>${ico('cam')}<span>${T('Foto','Photo')}</span></button>`;
  el.onclick=ev=>{ const p=ev.target.closest('[data-photo]'); if(p) return openEditor(p.dataset.photo,()=>renderPhotos(el,taskId,evalId));
    if(ev.target.closest('[data-addphoto]')){ photoTarget={el,taskId,evalId}; $('#file').value=''; $('#file').click(); } }; }
$('#file').onchange=async ev=>{ const tg=photoTarget; if(!tg) return; for(const f of ev.target.files){ try{ await addPhoto(f,tg.taskId,tg.evalId); }catch(err){ alert(T('Foto kon niet worden gelezen: ','Could not read photo: ')+f.name); } } renderPhotos(tg.el,tg.taskId,tg.evalId); touchTask(getTask(tg.taskId)); };
async function loadBitmap(blob){ if(window.createImageBitmap){ try{ return await createImageBitmap(blob,{imageOrientation:'from-image'}); }catch(e){} }
  return new Promise((res,rej)=>{ const im=new Image(), u=URL.createObjectURL(blob); im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=rej; im.src=u; }); }
const toBlob=(c,q=.86)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
function scaled(src,max){ const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return c; }
async function addPhoto(file,taskId,evalId){ const bmp=await loadBitmap(file), c=scaled(bmp,1600), full=await toBlob(c);
  const p={id:uid(),taskId,evalId:evalId||null,caption:'',thumb:scaled(c,320).toDataURL('image/jpeg',.8),w:c.width,h:c.height,ann:[],scale:null,created:Date.now()};
  await Store.putBlobs(p,{full,base:full}); S.photos.push(p); await Store.put('photos',p); return p; }

/* ---- photo editor: arrow, angle, ruler, text, blur (burned in) ---- */
const ED={};
async function openEditor(photoId,onClose){ const p=S.photos.find(x=>x.id===photoId); if(!p) return; const bl=await Store.getBlobs(p); if(!bl){ toast(T('Deze foto is nog niet gesynchroniseerd naar dit apparaat.','This photo has not been synced to this device yet.')); return; }
  const base=scaled(await loadBitmap(bl.base||bl.full),4000); Object.assign(ED,{p,base,ann:JSON.parse(JSON.stringify(p.ann||[])),scale:p.scale,tool:'arrow',pts:[],drag:null,undo:[],dirty:false,onClose});
  const tools=[['arrow',T('Pijl','Arrow')],['angle',T('Hoek','Angle')],['ruler',T('Maat','Measure')],['text',T('Tekst','Text')],['blur',T('Vervaag','Blur')]];
  $('#editor').innerHTML=`<div class="top"><button id="edx">${T('Sluit','Close')}</button><button id="eddel">${T('Verwijder','Delete')}</button><span style="flex:1"></span><button id="edsave" style="background:#F2C200;color:#111;border-color:#F2C200">${T('Bewaar','Save')}</button></div>
    <div class="top" style="padding-top:0"><input class="cap" id="edcap" type="text" placeholder="${T('Bijschrift voor het rapport','Caption for the report')}" value="${esc(p.caption)}"></div>
    <div class="stage"><canvas id="edc"></canvas><div class="ask" id="edask"><input type="text" id="edin"><button id="edok">OK</button></div><div class="hint" id="edhint"></div></div>
    <div class="tools">${tools.map(([k,l])=>`<button data-tool="${k}" aria-pressed="${k==='arrow'}">${l}</button>`).join('')}<button id="edundo">${T('Herstel','Undo')}</button></div>`;
  $('#editor').classList.add('on'); const cv=$('#edc'); cv.width=base.width; cv.height=base.height; edHint(); edDraw();
  const pt=ev=>{ const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left)*cv.width/r.width,y:(ev.clientY-r.top)*cv.height/r.height}; };
  cv.onpointerdown=ev=>{ ev.preventDefault(); if($('#edask').classList.contains('on')) return; const q=pt(ev);
    if(ED.tool==='angle'){ ED.pts.push(q); if(ED.pts.length===3){ ED.ann.push({t:'angle',p:ED.pts}); ED.undo.push('ann'); ED.pts=[]; ED.dirty=true; } edHint(); edDraw(); }
    else if(ED.tool==='text'){ edAsk(T('Tekst','Text'),'text',v=>{ if(v){ ED.ann.push({t:'text',a:q,s:v}); ED.undo.push('ann'); ED.dirty=true; edDraw(); } }); }
    else { ED.drag={a:q,b:q}; cv.setPointerCapture(ev.pointerId); } };
  cv.onpointermove=ev=>{ if(ED.drag){ ED.drag.b=pt(ev); edDraw(); } };
  cv.onpointerup=()=>{ const d=ED.drag; ED.drag=null; if(!d) return; const len=Math.hypot(d.b.x-d.a.x,d.b.y-d.a.y); if(len<edU()*6){ edDraw(); return; }
    if(ED.tool==='arrow'){ ED.ann.push({t:'arrow',a:d.a,b:d.b}); ED.undo.push('ann'); }
    else if(ED.tool==='ruler'){ const add=()=>{ ED.ann.push({t:'ruler',a:d.a,b:d.b}); ED.undo.push('ann'); edHint(); edDraw(); };
      if(!ED.scale) edAsk(T('Werkelijke lengte van deze lijn in cm (referentie)','Real length of this line in cm (reference)'),'number',v=>{ const n=num(v); if(n>0){ ED.scale=n/len; add(); } else edDraw(); }); else add(); }
    else if(ED.tool==='blur'){ const x=Math.round(Math.min(d.a.x,d.b.x)),y=Math.round(Math.min(d.a.y,d.b.y)),w=Math.round(Math.abs(d.b.x-d.a.x)),h=Math.round(Math.abs(d.b.y-d.a.y)); if(w>4&&h>4){ const bx=base.getContext('2d'); ED.undo.push({x,y,img:bx.getImageData(x,y,w,h)});
        const bs=Math.max(10,Math.max(w,h)/7), tw=Math.max(1,Math.ceil(w/bs)), th=Math.max(1,Math.ceil(h/bs)), tmp=document.createElement('canvas'); tmp.width=tw; tmp.height=th; const tc=tmp.getContext('2d'); tc.imageSmoothingEnabled=true; tc.drawImage(base,x,y,w,h,0,0,tw,th); bx.imageSmoothingEnabled=false; bx.drawImage(tmp,0,0,tw,th,x,y,w,h); bx.imageSmoothingEnabled=true; } }
    ED.dirty=true; edDraw(); };
  $('#editor .tools').onclick=ev=>{ const b=ev.target.closest('[data-tool]'); if(b){ ED.tool=b.dataset.tool; ED.pts=[]; $$('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x===b)); edHint(); edDraw(); } };
  $('#edundo').onclick=()=>{ if(ED.pts.length){ ED.pts.pop(); } else { const u=ED.undo.pop(); if(u==='ann'){ ED.ann.pop(); if(!ED.ann.some(a=>a.t==='ruler')) ED.scale=null; } else if(u) base.getContext('2d').putImageData(u.img,u.x,u.y); } edHint(); edDraw(); };
  $('#edx').onclick=()=>{ if(ED.dirty&&!confirm(T('Wijzigingen niet bewaren?','Discard changes?'))) return; edClose(); };
  $('#eddel').onclick=async()=>{ if(!confirm(T('Deze foto verwijderen?','Delete this photo?'))) return; await Store.del('photos',p.id); await Store.delBlobs(p); S.photos=S.photos.filter(x=>x.id!==p.id); edClose(); };
  $('#edsave').onclick=async()=>{ const out=document.createElement('canvas'); out.width=base.width; out.height=base.height; const c=out.getContext('2d'); c.drawImage(base,0,0); edPaint(c,ED.ann);
    p.caption=$('#edcap').value; p.ann=ED.ann; p.scale=ED.scale; p.thumb=scaled(out,320).toDataURL('image/jpeg',.8); await Store.putBlobs(p,{full:await toBlob(out),base:await toBlob(base,.9)}); await Store.put('photos',p); edClose(); }; }
function edClose(){ $('#editor').classList.remove('on'); $('#editor').innerHTML=''; const f=ED.onClose; ED.base=null; if(f) f(); }
function edAsk(label,type,cb){ const a=$('#edask'), i=$('#edin'); i.type=type; i.value=''; i.placeholder=label; if(type==='number') i.inputMode='decimal'; a.classList.add('on'); i.focus();
  const done=()=>{ a.classList.remove('on'); cb(i.value.trim()); }; $('#edok').onclick=done; i.onkeydown=e=>{ if(e.key==='Enter') done(); }; }
function edHint(){ const h={arrow:T('Sleep om een pijl te tekenen','Drag to draw an arrow'),angle:[T('Tik het eerste punt (bv. schouder)','Tap the first point (e.g. shoulder)'),T('Tik het draaipunt (bv. elleboog)','Tap the vertex (e.g. elbow)'),T('Tik het derde punt (bv. pols)','Tap the third point (e.g. wrist)')][ED.pts.length],ruler:ED.scale?T('Sleep om een afstand te meten','Drag to measure a distance'):T('Sleep eerst over een bekende lengte als referentie','First drag along a known length as reference'),text:T('Tik waar de tekst moet komen','Tap where the text should go'),blur:T('Sleep over gezichten of naamkaartjes; dit wordt in de foto gebrand','Drag over faces or name tags; this is burned into the photo')}[ED.tool]; $('#edhint').textContent=h+(ED.tool==='angle'||ED.tool==='ruler'?T(' — alleen betrouwbaar bij een foto haaks op het bewegingsvlak',' — only reliable when shot square to the plane of movement'):''); }
const edU=()=>Math.max(ED.base.width,ED.base.height)/420;
function edDraw(){ const cv=$('#edc'); if(!cv) return; const c=cv.getContext('2d'); c.drawImage(ED.base,0,0); const tmp=[...ED.ann]; const d=ED.drag;
  if(d){ if(ED.tool==='blur'){ edPaint(c,tmp); c.save(); c.setLineDash([edU()*3,edU()*3]); c.lineWidth=edU(); c.strokeStyle='#F2C200'; c.strokeRect(d.a.x,d.a.y,d.b.x-d.a.x,d.b.y-d.a.y); c.restore(); return; } tmp.push({t:ED.tool,a:d.a,b:d.b}); }
  edPaint(c,tmp); if(ED.pts.length){ c.fillStyle='#F2C200'; ED.pts.forEach(q=>{ c.beginPath(); c.arc(q.x,q.y,edU()*2.5,0,7); c.fill(); }); } }
function edPaint(c,anns){ const u=edU(), Y='#F2C200', K='rgba(10,16,20,.85)'; c.lineCap='round'; c.lineJoin='round';
  const line=(a,b)=>{ c.strokeStyle=K; c.lineWidth=u*3.2; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); c.strokeStyle=Y; c.lineWidth=u*1.6; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); };
  const label=(s,x,y)=>{ c.font=`600 ${u*9}px system-ui,sans-serif`; const w=c.measureText(s).width+u*8,h=u*14; x=Math.min(Math.max(x-w/2,2),c.canvas.width-w-2); y=Math.min(Math.max(y-h/2,2),c.canvas.height-h-2); c.fillStyle=K; c.beginPath(); c.roundRect?c.roundRect(x,y,w,h,u*3):c.rect(x,y,w,h); c.fill(); c.fillStyle=Y; c.textBaseline='middle'; c.fillText(s,x+u*4,y+h/2+u*.5); };
  for(const a of anns){
    if(a.t==='arrow'){ const ang=Math.atan2(a.b.y-a.a.y,a.b.x-a.a.x), hl=u*9; line(a.a,a.b); line(a.b,{x:a.b.x-hl*Math.cos(ang-.45),y:a.b.y-hl*Math.sin(ang-.45)}); line(a.b,{x:a.b.x-hl*Math.cos(ang+.45),y:a.b.y-hl*Math.sin(ang+.45)}); }
    else if(a.t==='ruler'){ const ang=Math.atan2(a.b.y-a.a.y,a.b.x-a.a.x)+Math.PI/2, k=u*4, tick=q=>line({x:q.x-k*Math.cos(ang),y:q.y-k*Math.sin(ang)},{x:q.x+k*Math.cos(ang),y:q.y+k*Math.sin(ang)}); line(a.a,a.b); tick(a.a); tick(a.b);
      const px=Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y); if(ED.scale||a.cm) label(fmtN(Math.round((a.cm||px*ED.scale)))+' cm',(a.a.x+a.b.x)/2,(a.a.y+a.b.y)/2-u*10); }
    else if(a.t==='angle'){ const [p1,v,p2]=a.p; line(v,p1); line(v,p2); const a1=Math.atan2(p1.y-v.y,p1.x-v.x), a2=Math.atan2(p2.y-v.y,p2.x-v.x); let dlt=a2-a1; while(dlt>Math.PI)dlt-=2*Math.PI; while(dlt<-Math.PI)dlt+=2*Math.PI;
      const rad=Math.min(u*22,Math.hypot(p1.x-v.x,p1.y-v.y)*.5,Math.hypot(p2.x-v.x,p2.y-v.y)*.5); c.strokeStyle=Y; c.lineWidth=u*1.2; c.beginPath(); c.arc(v.x,v.y,rad,a1,a2,dlt<0); c.stroke(); const mid=a1+dlt/2; label(Math.round(Math.abs(dlt)*180/Math.PI)+'°',v.x+Math.cos(mid)*(rad+u*14),v.y+Math.sin(mid)*(rad+u*14)); }
    else if(a.t==='text'){ label(a.s,a.a.x,a.a.y); } } }

/* ---- report ---- */
let RPT={full:true}, rptUrls=[];
function inputRows(m,inputs){ const out=[]; const val=(f,ctx)=>{ const v=ctx[f.k]; if(f.show&&!f.show(ctx)) return null;
    if(f.t==='chk') return v?T('Ja','Yes'):null; if(f.t==='num') return (v===''||v===undefined||v===null)?null:fmtN(v)+(f.unit?' '+tr(f.unit):'');
    if(f.t==='text') return v||null; if(String(v)==='0') return null; const o=f.o&&f.o.find(o=>String(o[0])===String(v)); return o?tr(o[1]):null; };
  m.steps.forEach(s=>s.fields.forEach(f=>{ if(f.t==='list'){ (inputs[f.k]||[]).forEach((it,n)=>out.push([tr(f.l)+' '+(n+1),f.item.map(sf=>{ const x=val(sf,it); return x===null?null:tr(sf.l)+': '+x; }).filter(Boolean).join(' · ')])); } else { const x=val(f,inputs); if(x!==null) out.push([tr(f.l),x]); } })); return out; }
const topParts=r=>(r.parts||[]).map(p=>({p,s:p.pen!==undefined?p.pen:(p.max?p.v/p.max:0)})).filter(x=>x.s>0.001).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>tr(x.p.l)).concat((r.parts||[]).length?[]:(r.rows||[]).filter(x=>x.band==='r'||x.band==='o').slice(0,4).map(x=>tr(x.l)));
async function viewReport(id){ const t=getTask(id), ev=taskEvals(id); $('#view').className='wide';
  setBar(T('Rapport','Report'),'#/t/'+id,`<button id="rmode"><span>${RPT.full?T('Volledig','Full'):T('Compact','Compact')}</span></button><button id="rprint">${ico('print')}<span>${T('Afdrukken','Print')}</span></button>`);
  rptUrls.forEach(u=>URL.revokeObjectURL(u)); rptUrls=[]; const url={};
  for(const p of photosOf(id)){ const b=await Store.getBlobs(p); if(b&&b.full){ url[p.id]=URL.createObjectURL(b.full); rptUrls.push(url[p.id]); } else url[p.id]=p.thumb; }
  ev.forEach(e=>e.result=M[e.method].calc(e.inputs));
  const fig=p=>`<figure><img src="${url[p.id]}" alt=""><figcaption>${esc(p.caption)}</figcaption></figure>`;
  const tp=photosOf(id,null), hero=tp[0]||photosOf(id)[0];
  const groups={}; ev.forEach(e=>{ const k=e.method+'|'+(e.label||''); (groups[k]=groups[k]||{m:M[e.method],label:e.label,before:[],after:[]})[e.phase==='after'?'after':'before'].push(e); });
  const cell=list=>list.length?list.map(e=>`<div class="row" style="gap:8px;flex-wrap:wrap"><b>${esc(scoreText(e.result))}</b>${chip(e.result)}</div>`).join(''):'<span class="muted">–</span>';
  const hasAfter=ev.some(e=>e.phase==='after'), cur=currentEvals(id), overall=worst(cur.map(e=>e.result.band));
  const issues=cur.filter(e=>e.result.band&&e.result.band!=='g').map(e=>({e,parts:topParts(e.result)})).filter(x=>x.parts.length);
  const evCard=e=>{ const m=M[e.method], r=e.result, h=railHtml(r), eph=photosOf(id,e.id);
    return `<div class="rcard"><div class="row" style="flex-wrap:wrap;margin-bottom:6px"><h3 class="grow">${esc(tr(m.name))}${e.label?' — '+esc(e.label):''} <span class="tag ${e.phase}">${phaseName(e.phase)}</span></h3><b style="font-size:1.2rem">${esc(scoreText(r))}</b>${chip(r)}</div>${h.gauge}
      <div class="rcols" style="margin-top:10px"><div><table>${inputRows(m,e.inputs).map(([l,v])=>`<tr><td class="muted" style="width:55%">${esc(l)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div><div>${h.more}</div></div>
      ${e.notes?`<p class="note"><b>${T('Toelichting','Notes')}:</b> ${esc(e.notes)}</p>`:''}${eph.length?`<div class="rphotos">${eph.map(fig).join('')}</div>`:''}<p class="ref">${esc(m.ref)}</p></div>`; };
  $('#view').innerHTML=`<article class="report">
    <p class="muted small" style="margin:0">${T('Beoordeling fysieke belasting','Physical workload assessment')}</p><h1>${esc(t.title||T('Naamloze taak','Untitled task'))}</h1>
    <div class="meta">${[[T('Afdeling','Department'),t.dept],[T('Werkplek / lijn','Workstation / line'),t.station],[T('Beoordelaar','Assessor'),t.assessor],[T('Datum','Date'),fmtD(t.date)],[T('Aantal medewerkers','Number of workers'),t.exposed],[T('Uren per dag','Hours per day'),t.hours]].map(([l,v])=>`<div><span>${l}</span>${esc(v||'–')}</div>`).join('')}</div>
    <div class="${hero?'rhero':''}"><div>${t.desc?`<p style="margin-top:0;white-space:pre-wrap">${esc(t.desc)}</p>`:''}
      <h2 style="margin-top:${t.desc?'14px':'0'}">${T('Samenvatting','Summary')}</h2>
      ${ev.length?`<p style="margin:0 0 8px">${T('Eindoordeel huidige situatie','Overall verdict, current state')}: ${chip({band:overall,levels:4})}</p><table><tr><th>${T('Methode','Method')}</th><th>${phaseName('before')}</th>${hasAfter?`<th>${phaseName('after')}</th>`:''}</tr>${Object.values(groups).map(g=>`<tr><td><b>${esc(tr(g.m.short))}</b>${g.label?'<br><span class="muted">'+esc(g.label)+'</span>':''}</td><td>${cell(g.before)}</td>${hasAfter?`<td>${cell(g.after)}</td>`:''}</tr>`).join('')}</table>`:`<p class="muted">${T('Nog geen beoordelingen.','No assessments yet.')}</p>`}
      </div>${hero?`<figure style="margin:0"><img src="${url[hero.id]}" alt=""><figcaption class="small muted">${esc(hero.caption)}</figcaption></figure>`:''}</div>
    ${issues.length?`<h2>${T('Belangrijkste knelpunten','Main contributing factors')}</h2><table>${issues.map(x=>`<tr><td style="width:30%"><b>${esc(tr(x.e.method&&M[x.e.method].short))}</b></td><td>${esc(x.parts.join(', '))}</td></tr>`).join('')}</table>`:''}
    ${t.triage&&t.triage.health?`<p class="note"><b>${T('Let op','Note')}:</b> ${T('er zijn gezondheidsklachten gemeld die met het werk te maken kunnen hebben.','health complaints that may be work-related have been reported.')}</p>`:''}
    <h2>${T('Maatregelen','Measures')}</h2>${t.measures.length?`<table><tr><th>${T('Maatregel','Measure')}</th><th>${T('Niveau','Level')}</th><th>${T('Eigenaar','Owner')}</th><th>${T('Gereed voor','Due')}</th><th>${T('Status','Status')}</th></tr>${[...t.measures].sort((a,b)=>a.level.localeCompare(b.level)).map(m=>`<tr><td>${esc(m.text)}</td><td>${esc(m.level+'. '+tr((STRAT.find(s=>s[0]===m.level)||STRAT[0])[1]))}</td><td>${esc(m.owner)}</td><td>${esc(fmtD(m.due))}</td><td>${m.done?T('Gereed','Done'):T('Open','Open')}</td></tr>`).join('')}</table>`:`<p class="muted">${T('Geen maatregelen vastgelegd.','No measures recorded.')}</p>`}
    ${RPT.full&&ev.length?`<h2 class="pagebreak">${T('Beoordelingen in detail','Assessments in detail')}</h2>${ev.map(evCard).join('')}`:''}
    ${tp.length>(hero&&!hero.evalId?1:0)?`<h2>${T('Foto\'s','Photos')}</h2><div class="rphotos">${tp.filter(p=>p!==hero).map(fig).join('')}</div>`:''}
    <div class="sign"><div>${T('Beoordelaar','Assessor')}${t.assessor?': '+esc(t.assessor):''}</div><div>${T('Leidinggevende / akkoord','Manager / approval')}</div></div>
    <p class="ref">${T('Opgesteld met','Prepared with')} ErgoFlow ${VERSION}. ${T('De methoden geven een risico-inschatting op taakniveau; bij klachten of meerdere zware taken per dag een deskundige raadplegen.','The methods give a task-level risk estimate; with complaints or several heavy tasks per day, consult an expert.')}</p></article>`;
  $('#rmode').onclick=()=>{ RPT.full=!RPT.full; viewReport(id); };
  $('#rprint').onclick=async()=>{ await Promise.all($$('.report img').map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;}))); window.print(); }; }

/* ---- export / import ---- */
const blobToData=b=>new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
const dataToBlob=async d=>(await fetch(d)).blob();
async function exportJSON(taskId){ const tasks=taskId?[getTask(taskId)]:S.tasks, ids=new Set(tasks.map(t=>t.id)), photos=[];
  for(const p of S.photos.filter(p=>ids.has(p.taskId))){ const b=await Store.getBlobs(p); photos.push(Object.assign({},p,{full:b?await blobToData(b.full):null,base:b&&b.base&&b.base!==b.full?await blobToData(b.base):null})); }
  const data={app:'ergoflow',format:1,version:VERSION,exported:new Date().toISOString(),tasks,evals:S.evals.filter(e=>ids.has(e.taskId)).map(e=>Object.assign({},e,{result:undefined})),photos};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download='ergoflow-'+(taskId?(tasks[0].title||'taak').replace(/[^\w-]+/g,'_').slice(0,40):'export')+'-'+today()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
$('#imp').onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(d.app!=='ergoflow') throw 0;
    for(const t of d.tasks||[]) await Store.put('tasks',t); for(const e of d.evals||[]) await Store.put('evals',e);
    for(const p of d.photos||[]){ const {full,base,...meta}=p; if(typeof full==='string'){ const fb=await dataToBlob(full); await Store.putBlobs(meta,{full:fb,base:typeof base==='string'?await dataToBlob(base):fb}); } await Store.put('photos',meta); }
    await loadAll(); closeSheet(); route(); alert(T('Import gereed: ','Import complete: ')+(d.tasks||[]).length+' '+T('taken','tasks')); }
  catch(e){ alert(T('Dit is geen geldig ErgoFlow-bestand.','This is not a valid ErgoFlow file.')); } ev.target.value=''; };

/* ---- boot ---- */
async function loadAll(){ [S.tasks,S.evals,S.photos]=await Promise.all([Store.all('tasks'),Store.all('evals'),Store.all('photos')]);
  S.evals=S.evals.filter(e=>M[e.method]); S.evals.forEach(e=>{ try{ e.result=M[e.method].calc(e.inputs); }catch(err){ e.result={band:null,score:null}; } }); S.tasks.forEach(t=>{ t.triage=t.triage||{}; t.measures=t.measures||[]; }); }
(async()=>{ document.documentElement.lang=LANG; setBar('ErgoFlow',null); $('#view').innerHTML=`<div class="empty">${T('Laden…','Loading…')}</div>`; try{ await Store.open(); await loadAll(); }catch(e){ $('#view').innerHTML=`<div class="empty">${T('Opslag is niet beschikbaar in deze browser (privémodus?).','Storage is not available in this browser (private mode?).')}</div>`; return; } route(); })();
</script>
